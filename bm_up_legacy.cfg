// BakersfieldQuake one-shot migrations v1 -> v12, folded into one file (2026-11-18).
// quake.rc runs this once for any player whose saved bm_defver is below 12, then marks them current.
// Steps are kept in order; later steps intentionally override earlier ones (e.g. step 9 frees Z/- that step 2 bound).

// --- step 1
// BakersfieldQuake keybind migration v1 -> v2: bind M4A1 (impulse 67) on C and 0 without touching existing custom binds.
bind c "impulse 67"
bind 0 "impulse 67"

// --- step 2
// BakersfieldQuake keybind migration v2 -> v3: bind DoD Thompson (impulse 68) on Z / - and M1 Garand (impulse 69) on M / = without touching existing custom binds.
bind z "impulse 68"
bind - "impulse 68"
bind m "impulse 69"
bind = "impulse 69"

// --- step 3
// BakersfieldQuake keybind migration v3 -> v4: F1 = add enemy [BOT], F2 = kick [BOT], F3 = join LAN game (F7 = online server).
bind F1 "addbotenemy"
bind F2 "removebot"
bind F3 "exec lan_server.cfg"

// --- step 4
// BakersfieldQuake keybind migration v4 -> v5: bind Jar o' Green Guys (impulse 62) on I without touching existing custom binds.
bind i "impulse 62"

// --- step 5
// BakersfieldQuake LAN fun-audit update (bm_up_5.cfg) - updates gameplay cvars once without touching player keybinds
seta mb_pool ""
seta bm_fun 1
seta bm_fun_gap 10
seta bm_ud_resist 0
seta veh_respawn 30
seta jp_fuel 40
seta jp_hover 0.8
seta bm_scroll_fun 1
seta bm_spawnprot 3
seta bm_spawnpause 0.5

// --- step 6
// BakersfieldQuake update v6 -> v7: the Mystery Box fun gun was removed (2026-11-13). Its key U (impulse 65) now does nothing,
// so free it; mb_pool only fed the box.
unbind u
seta mb_pool ""

// --- step 7
// BakersfieldQuake update v7 -> v8: restore mouse-wheel scrolling through every gun (including Rob Dob, Jar o' Green Guys, Pickle Surprise, NetSend and Wheelman Cannon).
seta bm_scroll_fun 1

// --- step 8
// BakersfieldQuake update v8 -> v9: bind Dookie Bazooka (impulse 65) on U without touching existing custom binds.
bind u "impulse 65"

// --- step 9
// BakersfieldQuake update v9 -> v10: the Thompson SMG (impulse 68) and Chainsaw were removed (2026-11-16).
// Free keys Z and - so custom binds on them don't linger.
unbind z
unbind -

// --- step 10
// BakersfieldQuake update v10 -> v11: fix dark models, dark viewmodels, and stale texture-compression / gamma settings (2026-11-17).
seta r_minlight "3"
seta gl_overbright_models "0"
gl_texturecompression "0"
gl_texture_anisotropy "16"
r_hdr_scenebrightness "1.45"
v_gamma "1.3125"
v_contrast "1.125"
v_glslgamma_2d "1"
r_shadow_realtime_dlight_shadows "1"
r_glsl_offsetmapping "1"
r_bloom "1"
r_bloom_blur "0.1"
r_bloom_brighten "0.1"

// --- step 11
// BakersfieldQuake update v11 -> v12: migrate stale HUD FPS counter, lightmap staining, and decal budget once (2026-11-17).
showfps "0"
cl_stainmaps "0"
cl_decals "1"
cl_decals_max "256"
cl_decals_time "16"
cl_decals_fadetime "4"
cl_decals_models "0"
seta gl_overbright_models "0"
