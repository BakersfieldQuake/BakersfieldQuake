// pretty.cfg - the best-looking settings Zircon supports. In game: ~ then  exec pretty
// To go back to the normal look:  exec pretty_off
// (Zircon saves these on quit, so they stay until you exec pretty_off. It costs FPS in big fights.)

// ---- smoother edges and sharper textures
vid_samples 4                           // 4x MSAA (8 if your card has headroom; needs a restart)
gl_texture_anisotropy 16
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
r_glsl_offsetmapping 1                  // bumpy relief on normal-mapped surfaces
r_glsl_offsetmapping_reliefmapping 1    // true relief (steep parallax) instead of the cheap version
r_glsl_offsetmapping_scale 0.04

// ---- lights and shadows
r_shadow_realtime_dlight 1              // rockets, muzzle flashes and explosions light the room
r_shadow_realtime_dlight_shadows 1
r_shadow_shadowmapping 1
r_shadow_shadowmapping_maxsize 1024     // sharper shadow edges (512 is the default)
r_shadow_gloss 1
r_shadow_glossexact 1                   // correct specular highlights
r_shadow_usenormalmap 1
r_coronas 0.6                           // glow around lights, rockets and plasma
r_lerplightstyles 1                     // flickering lights fade instead of popping

// ---- water: reflections and refraction
r_water 1
r_water_lowquality 0
r_water_resolutionmultiplier 0.75
r_wateralpha 0.5

// ---- models, particles, decals
r_lerpmodels 1
cl_particles_quality 1
cl_decals 1
cl_stainmaps 1                          // blood and scorch marks stain the walls
cl_decals_max 512

// ---- colour
r_glsl_saturation 1.1
v_glslgamma_2d 1

// (bloom is left alone on purpose. Turn it on with: r_bloom 1)
echo "pretty graphics on (exec pretty_off to undo)"
