// BakersfieldQuake (Bakersfield LAN) autoexec.cfg - runs BEFORE config.cfg.
// seta = saved. A change made in game is written to config.cfg and wins next time.

// ---- magazines and reloading (bm_reload.qc)
seta bm_reload 1				// 0 = stock Combat+ ammo
seta bm_mag_scale 1			// magazine sizes x this
seta bm_reload_scale 1		// reload times x this
seta bm_holster 0.25			// holstered guns refill at this fraction of the held reload speed
seta bm_idle_reload 2.5		// seconds without firing before a part-empty gun tops itself up

// ---- survivability (bm_match.qc)
seta bm_selfdamage 0.6		// self-damage x this, on top of the stock halving of your own splash (rocket jumps keep their push)
seta bm_rocketself 0.4		// your own rockets' self-damage x this as well (0.4 = 60% less)
seta bm_falldamage 0
seta bm_spawnprot 3			// seconds of spawn protection (firing ends it)
seta bm_spawnpause 0.5		// seconds after a protected spawn before you can fire
seta bm_regen_delay 5		// seconds after the last hit before health comes back
seta bm_regen_rate 10		// health per second
seta bm_intermission 10		// end-of-map scoreboard seconds, then the next map loads by itself

// ---- keeping scores close (underdog.qc)
seta bm_handicap 1			// leader glow / beacon, underdog spawn boosts
seta bm_bounty 1				// killing someone 4+ frags ahead of the pack: +1 bonus frag
seta bm_giantslayer 0			// 0 = consistent vanilla gun damage (no hidden underdog damage multiplier)
seta bm_spawnnear 1200		// spawn near the action, but not this close to a rival
seta bm_fg_lock 0			// fun-gun swap lock: OFF (was 10 s; set N to lock the OTHER fun guns for N seconds after one fires)
seta bm_nopredict 1			// no client prediction on jetpack, shock, milk: less snap-back online
seta slowmotion 0			// Combat+ slows the whole server when a monster is gibbed
seta changeweaponsounds 0.35	// was 0.7
seta casingdropsound 0.2		// was 0.52
seta bm_ud_resist 0			// replaced invisible bullet-sponge resistance with visible Mario-Kart catch-up toys!
seta bm_ud_streak 6			// deaths in a row for Last Stand with 3-5 players (+1 in a 1v1, -1 at 6+, -2 at 10+)
seta bm_ud_span 8			// frags behind the leader for the full gap signal in a 1v1 (tighter with more players)
seta bm_ud_botcap 0.6		// bots' boost stops here and they never get Last Stand
seta bm_spawnarmor 100		// green armor on every spawn (0 = none, like stock Quake)
seta bm_ud_yellow 0.3		// boost for spawning with yellow armor (150)
seta bm_ud_red 0.75			// boost for spawning with capped 150 yellow/red armor

// ---- vehicles, jetpack & scroll wheel
seta veh_respawn 30			// destroyed vans, muscle cars, school buses & golf carts respawn after 30 s
seta jp_fuel 40				// 40 s climb / ~50 s hover tank per jetpack pickup
seta jp_hover 0.8			// fuel used per second while hovering
seta bm_scroll_fun 1		// 1 = mouse wheel cycles through ALL guns (including Rob Dob, Jar o' Green Guys, Pickle Surprise, NetSend PC, Wheelman Cannon, M4/Garand)

// ---- the kill announcer (bm_fun.qc): text only, first blood, sprees, multi-kills, revenge
seta bm_fun 1				// 0 = no announcer text either
seta bm_fun_multi 3			// kills this close together are a DOUBLE / TRIPLE / MULTI KILL

// ---- Combat+ settings that don't suit a LAN deathmatch
seta z_coopconfig 1					// q15_config_coop.cfg is already loaded (stops a map restart on connect)
seta slowmotion_randomness_player 0	// no slow motion for everyone when someone dies
seta zombieaxeanimation 0
seta weapon_chain_thunderbolt 0
seta player_legs_visibility 0		// no first-person look-down legs
seta 3rd_person_visible_weapons 0	// keep classic Quake Ranger (progs/player_id1.mdl)

// your own extra settings (binds, name...) go in personal.cfg; it is never shipped in the LAN zip
exec personal.cfg


// ---- David Ojeda & 3 Pregnant Runners (david.qc)
seta dv_mode 0
seta dv_stay 0
seta dv_spin 0

// ---- Enemy [BOT] settings & 16-player match capacity (bm_bots.qc)
maxplayers 16
seta bm_bot_easy 1			// 1 = fun, forgiving human aim wander & reaction pacing
seta bm_bot_dmg 0.65		// bot-to-player damage multiplier (keeps 5-10+ bot matches fun)
seta bm_bot_tags 1			// floating 3D [BOT] overhead nameplates
seta bm_player_tags 1			// close-up overhead nameplates for human players in multiplayer
seta bm_bot_jpfuel 2.2		// seconds of starting jetpack fuel per bot spawn

// ---- main menu scenic background (menu.dat + bm_match.qc + bm_hud.qc)
seta menu_background 1
seta menu_background_map "soi6 soicowboy_bkk bakersfielddowntown"
set bm_menu_bg 0

// Keys and video/graphics defaults (F1 = online server, F2 = LAN game, binoculars...) are in default.cfg, which runs BEFORE
// the player's saved config.cfg, so anything a player rebinds or changes in the menu is kept.
