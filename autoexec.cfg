// BakersfieldQuake (Bakersfield LAN) autoexec.cfg - runs after config.cfg on every start (players, warmup and the server).
// Only game-rule defaults live here (set = not saved); nothing that would undo a player's own saved settings, binds or video.

// ---- magazines and reloading (bm_reload.qc)
set bm_reload 1				// 0 = stock Combat+ ammo
set bm_mag_scale 1			// magazine sizes x this
set bm_reload_scale 1		// reload times x this
set bm_holster 0.25			// holstered guns refill at this fraction of the held reload speed
set bm_idle_reload 2.5		// seconds without firing before a part-empty gun tops itself up

// ---- survivability (bm_match.qc)
set bm_selfdamage 0.6		// self-damage x this, on top of the stock halving of your own splash (rocket jumps keep their push)
set bm_rocketself 0.4		// your own rockets' self-damage x this as well (0.4 = 60% less)
set bm_falldamage 0
set bm_spawnprot 3			// seconds of spawn protection (firing ends it)
set bm_spawnpause 0.5		// seconds after a protected spawn before you can fire
set bm_regen_delay 5		// seconds after the last hit before health comes back
set bm_regen_rate 10		// health per second
set bm_intermission 10		// end-of-map scoreboard seconds, then the next map loads by itself

// ---- keeping scores close (underdog.qc)
set bm_handicap 1			// leader glow / beacon, underdog spawn boosts
set bm_bounty 1				// killing someone 4+ frags ahead of the pack: +1 bonus frag
set bm_giantslayer 0.25		// underdogs deal up to +25% damage to players with more frags (was 1: with quad that made x8)
set bm_spawnnear 1200		// spawn near the action, but not this close to a rival
set bm_fg_lock 10			// firing a fun gun locks the OTHER fun guns for this many seconds (0 = off)
set bm_nopredict 1			// no client prediction on jetpack, goo, shock, milk: less snap-back online
set slowmotion 0			// Combat+ slows the whole server when a monster is gibbed
set changeweaponsounds 0.35	// was 0.7
set casingdropsound 0.2		// was 0.52
set bm_ud_resist 0.35		// and take up to 35% less from them
set bm_ud_streak 7			// deaths in a row for Last Stand with 3-5 players (+1 in a 1v1, -1 at 6+, -2 at 10+)
set bm_ud_span 8			// frags behind the leader for the full gap signal in a 1v1 (tighter with more players)
set bm_ud_botcap 0.6		// bots' boost stops here and they never get Last Stand
set bm_spawnarmor 100		// green armor on every spawn (0 = none, like stock Quake)
set bm_ud_yellow 0.3		// boost for spawning with yellow armor (150)
set bm_ud_red 0.6			// boost for spawning with red armor (200, 250 at boost 0.9+)

// ---- the kill announcer (bm_fun.qc): first blood, sprees, multi-kills, revenge, a cheer for last place
set bm_fun 0				// 0 = off (lines and clips)
set bm_newbie 0			// the "newbie" taunt when you kill last place (it plays even with bm_fun 0)
set bm_fun_gap 3			// seconds between two clips
set bm_fun_multi 3			// kills this close together are a DOUBLE / TRIPLE / MULTI KILL
set bm_fun_cheer 1			// chance the room cheers when the player in last place gets a kill
set bm_fun_larry 0.7		// chance a clip is the Larry McCart one instead of the stock clip

// ---- Combat+ settings that don't suit a LAN deathmatch
set z_coopconfig 1					// q15_config_coop.cfg is already loaded (stops a map restart on connect)
set slowmotion_randomness_player 0	// no slow motion for everyone when someone dies
set zombieaxeanimation 0
set weapon_chain_thunderbolt 0

// your own extra settings (binds, name...) go in personal.cfg; it is never shipped in the LAN zip
exec personal.cfg

// ---- Mystery Box (mbox.qc): which monsters can come out (roster numbers; vote of 2026-11-01). Empty = every monster that is built.
set mb_pool "10 11 17 18 19 20 21 22"

// ---- David Ojeda & 3 Pregnant Runners (david.qc)
set dv_mode 0
set dv_stay 0
set dv_spin 0

// Keys and video/graphics defaults (F1 = online server, F2 = LAN game, binoculars...) are in default.cfg, which runs BEFORE
// the player's saved config.cfg, so anything a player rebinds or changes in the menu is kept.
