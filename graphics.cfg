// ============================================================================
// BakersfieldQuake - graphics.cfg
// Restores full Combat+ / Zircon high-quality graphics settings while
// keeping 100% of the load-time, VRAM-upload, and framerate optimizations.
//
// Usage in console (~ or F12):
//   exec graphics.cfg
// (Settings are automatically saved to config.cfg when you quit the game.)
// ============================================================================

// ---- 1. Display, Resolution & Hardware Shaders ----
vid_fullscreen "1"                      // Borderless fullscreen out of the box (toggleable in Options -> Video)
vid_desktopfullscreen "1"
vid_borderless "0"
vid_width "1920"
vid_height "1080"
_vid_fullscreen_width "1920"
_vid_fullscreen_height "1080"
_vid_window_width "1920"
_vid_window_height "1080"
vid_conwidth "640"
vid_conheight "360"
vid_samples "4"                         // 4x MSAA anti-aliasing ("1" or "0" if you want max GPU headroom)

// ---- 2. Dynamic Lighting, Shadows, HDR & Bloom ----
seta lowspec "0"
r_dynamic "1"                           // dynamic point lights enabled
r_shadow_realtime_dlight "1"            // dynamic lights on rockets, explosions, muzzle flashes & custom guns
r_shadow_realtime_dlight_shadows "0"    // dynamic shadows off to prevent 20 FPS drops during multi-player fights on big maps ("1" to re-enable)
r_shadow_shadowmapping "0"
r_shadow_shadowmapping_texturesize "4096"
r_shadow_realtime_world "0"             // maps use baked colored .lit lightmaps (Combat+ default)
r_shadow_gloss "1"                      // specular gloss highlights on surfaces & models
r_shadow_glossexact "0"
r_shadow_usenormalmap "1"
r_load_normalmap "1"
r_load_gloss "1"
r_glsl_deluxemapping "1"
seta r_minlight "3"                     // minimum ambient floor on models/viewmodels/NPCs (prevents pitch-black models on unlit corners)
seta gl_overbright_models "0"           // keep white vehicles/props unclipped while r_minlight lifts shadows
r_hdr_scenebrightness "1.45"            // balanced HDR scene brightness (prevents blown-out white roofs/stucco)
v_gamma "1.3125"                        // clean gamma (avoids washed-out grey blacks)
v_contrast "1.125"                      // crisp darks and saturated colors
v_brightness "0"
v_glslgamma_2d "1"                      // applies GLSL gamma to 2D Quake HUD & fonts so HUD is never dark in windowed mode
r_bloom "1"                             // Combat+ subtle HDR bloom glow
r_bloom_blur "0.1"
r_bloom_brighten "0.1"
r_coronas "0.6"                         // light coronas on rockets, plasma, lasers & torches
r_lerplightstyles "1"                   // smooth flickering map lights

// ---- 3. Texture Resolution, Filtering, Models & Particles ----
gl_picmip "0"                           // full 1:1 native texture resolution (never downscale)
gl_picmip_world "0"
gl_picmip_other "0"
gl_picmip_sprites "0"
gl_picmip_force "0"
gl_max_size "2048"
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"// smooth trilinear HD filtering (use "GL_NEAREST_MIPMAP_LINEAR" for retro pixel look)
gl_texture_anisotropy "16"              // 16x anisotropic filtering (sharp angled floors, signs & vehicles; zero load cost)
r_glsl_offsetmapping "1"                // parallax relief mapping on normal-mapped surfaces
r_glsl_offsetmapping_reliefmapping "0"
r_water "0"
r_glsl_saturation "1"
r_lerpmodels "1"                        // smooth 3D model animation interpolation
r_wateralpha "0.4"                      // translucent water surfaces
cl_particles_quality "1"                // full Combat+ particle detail
cl_beams_lightatend "1"                 // dynamic light at lightning/laser beam impact
cl_maxfps "250"                         // uncapped smooth framerate up to 250 FPS
menu_background "1"

// ---- 4. Load-Time & Runtime Optimizations (KEPT ACTIVE) ----
gl_texturecompression "0"               // keeps uncompressed 32-bit RGBA quality AND skips multi-minute CPU S3TC load stall
mod_bsp_portalize "0"                   // skips 15s+ unused BSP portal build on map load (zero visual change)
developer "0"                           // disables console debug print overhead
showfps "1"                             // show FPS counter on HUD (toggleable in Options -> Graphics)
r_lerpsprites "0"                       // prevents multi-angle sprite ghosting on custom characters & Wheelman
cl_decals "1"                           // weapon impact decals & splatters
cl_decals_max "1024"                    // large decal pool so blood splatters linger across fights
cl_decals_time "60"                     // decals begin fading after 60s
cl_decals_fadetime "15"                 // 15s fade-out (~75s total lifetime)
cl_decals_models "0"                    // avoid projecting decals onto animated MD3s
cl_stainmaps "0"                        // never permanently stain BSP lightmaps black

// ---- Apply video, shader & texture settings immediately ----
vid_restart
echo "BakersfieldQuake: Full graphics restored (all load & FPS optimizations kept active)!"
