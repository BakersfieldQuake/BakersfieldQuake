// BakersfieldQuake (Bakersfield LAN) local warmup - Play.cmd runs this when no LAN server is up yet.
// A private game on dm6 with a few bots; press F2 to join the LAN server once it is running (F1 = the online server).

port 26001				// not the LAN port, so other players' searches never find this game
maxplayers 4
deathmatch 1
coop 0
teamplay 0
skill 1
timelimit 0
fraglimit 0
noexit 1
set bm_maplist ""
set bm_warmup 1
set bm_botfill 4			// you + 3 FrikBots

map dm6
