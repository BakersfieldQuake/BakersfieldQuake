// BakersfieldQuake (Bakersfield LAN) local warmup - Play.cmd runs this when no LAN server is up yet.
// A private game on dm6 with a few bots; press F1/F2 to add/kick bots, F3 to join LAN, F7 for online server.

port 26001				// not the LAN port, so other players' searches never find this game
maxplayers 16
deathmatch 1
coop 0
teamplay 0
skill 1
timelimit 0
fraglimit 0
noexit 1
set bm_maplist ""
set bm_warmup 1
set bm_botfill 4			// you + 3 FrikBots
sys_ticrate 0.0138889
sv_maxrate 1000000
sv_clmovement_inputtimeout 0.25
sv_gameplayfix_downtracesupportsongroundflag 1
sv_wallfriction 0
sv_jumpstep 1
sv_maxvelocity 6500
set pushback 0
set shellcasing 0
set sv_antilag 1
set sv_antilag_maxping 450

map dm6
