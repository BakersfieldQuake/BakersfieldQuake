// BakersfieldQuake migration v19 -> v20 (quake.rc: bm_up_19 runs it once for anyone at v19):
// Redesigned solid-black modern console, outlined Roboto fonts, colored chat/console, transparent directional minimap, and invisibility disabled.
scr_conalpha "1"
scr_conalphafactor "1"
scr_conalpha2factor "0"
scr_conalpha3factor "0"
scr_conbrightness "0"
con_textsize "10"
con_chat "4"
con_chatrect "1"
con_chatrect_x "0.24"
con_chatrect_y "0.68"
con_chatwidth "0.55"
con_chatsize "11"
con_chattime "30"
con_notify "3"
con_notifysize "10"
con_notifytime "4"
con_hints "1"
r_font_antialias "1"
r_font_hinting "3"
r_font_postprocess_outline "1"
r_font_postprocess_shadow_x "0.75"
r_font_postprocess_shadow_y "0.75"
r_font_postprocess_blur "0"
r_textshadow "1"
seta bm_ui_font "1"
seta bm_minimap_range "1600"
seta bm_minimap_size "42"
seta bm_minimap_alpha "1.0"
seta bm_minimap_bg_alpha "0"
seta bm_minimap_map_alpha "0"
seta bright_skins "1"
loadfont default engine/fonts/Roboto-Medium.ttf 8 10 12 14 16 20 24 32
loadfont console engine/fonts/Roboto-Medium.ttf 8 10 12 14 16 20 24 32
loadfont chat engine/fonts/Roboto-Medium.ttf 8 10 12 14 16 20 24 32
loadfont notify engine/fonts/Roboto-Medium.ttf 8 10 12 14 16 20 24 32
loadfont centerprint engine/fonts/Roboto-Medium.ttf 8 10 12 14 16 20 24 32
loadfont infobar engine/fonts/Roboto-Medium.ttf 8 10 12 14 16 20 24 32
loadfont sbar engine/fonts/Roboto-Medium.ttf 8 10 12 14 16 20 24 32
loadfont menu engine/fonts/Roboto-Medium.ttf 8 10 12 14 16 20 24 32
