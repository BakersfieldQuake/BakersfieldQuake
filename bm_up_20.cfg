// BakersfieldQuake migration v19 -> v20 (quake.rc: bm_up_19 runs it once for anyone at v19):
// Solid-black console, readable classic conchars settings, transparent directional minimap, and invisibility disabled.
scr_conalpha "1"
scr_conalphafactor "1"
scr_conalpha2factor "0"
scr_conalpha3factor "0"
scr_conbrightness "0"
r_nearest_conchars "0"
r_textshadow "0.75"
con_textsize "10"
con_chatsize "10"
con_notifysize "10"
con_notifytime "4"
con_hints "1"
seta bm_ui_font "1"
seta bm_minimap_range "1600"
seta bm_minimap_size "42"
seta bm_minimap_alpha "1.0"
seta bm_minimap_bg_alpha "0"
seta bm_minimap_map_alpha "0"
seta bright_skins "1"
