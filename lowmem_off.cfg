// lowmem_off.cfg - undoes lowmem.cfg: full-size model textures. In game: ~ then  exec lowmem_off  and restart the game.
// (On a PC with under 10 GB of RAM or weak graphics the launcher turns lowmem back on at the next start unless
// BQ_LOWMEM=0 is set.)

gl_picmip_other 0
r_shadow_shadowmapping_texturesize 4096
echo "low-memory textures off (restart the game to apply)"
