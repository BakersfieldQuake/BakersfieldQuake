// lowmem_off.cfg - undoes lowmem.cfg / ultralow.cfg / safemode.cfg texture-memory limits.
// In game: ~ then  exec lowmem_off  and restart the game.
// (On a PC with low RAM or weak graphics the launcher may re-apply a low-memory tier unless BQ_TIER=normal or BQ_LOWMEM=0.)

gl_picmip 0
gl_picmip_world 0
gl_picmip_other 0
gl_picmip_sprites 0
gl_picmip_force 0
gl_max_size 2048
gl_texturecompression 0
r_shadow_shadowmapping_texturesize 4096
menu_background 1
r_buffermegs_vertex 4
r_buffermegs_index16 1
r_buffermegs_index32 1
r_buffermegs_uniform 0.25
r_framedatasize 1
mod_q1bsp_lazy_render_bih 0		// engine default; lowmem.cfg sets 1 (mod_q1bsp_pvs_ondemand 1 is already the default, and quake.rc keeps mod_freebeforeload 1 for everyone)
echo "low-memory textures off (restart the game to apply)"
