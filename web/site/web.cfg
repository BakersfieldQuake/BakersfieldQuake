// BakersfieldQuake browser client settings. The play page runs this after config.cfg (+exec web.cfg).
// The browser engine draws through WebGL2, so keep the expensive extras off.

cl_curl_enabled 0                       // the page already loaded every file
vid_fullscreen 0                        // the page handles fullscreen
vid_resizable 1                         // follow the browser window size
vid_samples 0
v_hwgamma 0

r_glsl_offsetmapping 0
r_glsl_offsetmapping_reliefmapping 0
r_water 0
r_shadow_realtime_dlight_shadows 0
r_shadow_shadowmapping 0
r_bloom 0
gl_texture_anisotropy 4
cl_stainmaps 0
cl_decals_max 256

// The browser engine's full-screen post-process pass draws a black screen. These keep it switched off:
// any gamma/contrast/saturation change or a screen flash (pickup, damage, quad) turns it on.
v_gamma 1
v_contrast 1
v_brightness 0
v_glslgamma 0
r_glsl_saturation 1
gl_polyblend 0

// Neutralize default.cfg's r_hdr_scenebrightness 1.45 so WASM matches WebGL 2.00x overbright
// (only scales r_refdef.view.colorscale; does not trigger the FBO post-process pass).
r_hdr_scenebrightness 1
