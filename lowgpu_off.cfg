// lowgpu_off.cfg - undoes lowgpu.cfg / ultralow.cfg / safemode.cfg graphics reductions.
// In game: ~ then  exec lowgpu_off  and restart the game.

seta lowspec 0
r_bloom 1
r_bloom_blur 0.1
r_bloom_brighten 0.1
r_shadow_realtime_dlight 1
r_shadow_realtime_dlight_shadows 1
r_shadow_gloss 1
r_shadow_glossexact 0
r_shadow_shadowmapping 0
r_shadow_usenormalmap 1
r_load_normalmap 1
r_load_gloss 1
r_glsl_offsetmapping 1
r_glsl_offsetmapping_reliefmapping 0
r_glsl_deluxemapping 1
r_dynamic 1
r_lerplightstyles 1
r_water 0
r_coronas 0.6
r_glsl_saturation 1
cl_particles_quality 1
cl_particles_rain 1
cl_particles_snow 1
cl_decals 1
cl_decals_max 256
cl_decals_time 16
cl_decals_fadetime 4
cl_decals_models 0
cl_stainmaps 0
vid_samples 4
gl_texture_anisotropy 16
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
seta r_minlight 3
seta gl_overbright_models 0
cl_maxfps 250
menu_background 1
saveconfig
echo "weak-graphics settings off (restart the game to apply)"
