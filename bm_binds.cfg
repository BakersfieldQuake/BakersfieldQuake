// BakersfieldQuake default keys. quake.rc runs this ONCE, on a brand new player's first launch (and when bm_defver is raised).
// After that the player's saved config.cfg is the only source of keys, so a key they rebind or clear stays that way.
// New default keys for a later update: add a bm_up_<N>.cfg migration and chain it in quake.rc (see the comment there).

unbindall
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind SPACE "+jump"
bind SHIFT "+button4"			// Winged John: hold to swoop / accelerate boost
bind MOUSE2 "+jump"
bind MOUSE1 "+attack"
bind MWHEELUP "impulse 12"		// previous weapon
bind MWHEELDOWN "impulse 10"	// next weapon
bind 1 "impulse 1"				// hammer
bind 2 "impulse 3"				// pump shotgun (the single shotgun is gone)
bind 3 "impulse 3"				// super shotgun
bind 5 "impulse 5"				// super nailgun
bind 6 "impulse 6"				// grenade launcher
bind 7 "impulse 7"				// rocket launcher
bind 8 "impulse 8"				// lightning gun / CCC gun (was the laser cannon)
bind 9 "impulse 14"				// Mega Man gun
bind 0 "impulse 67"				// M4A1: stand-alone CS 1.6 automatic rifle
bind q "+gunwheel"				// Gun Wheel: hold, point at a gun, let go
bind e "impulse 7"				// rocket launcher
bind f "impulse 61"				// Rob Dob
bind i "impulse 62"				// Jar o' Green Guys: hold fire to shake, release to swarm (fun gun 2)
bind x "impulse 63"				// Pickle Surprise
bind r "impulse 41"				// reload
unbind c						// the proximity grenade is removed
bind v "impulse 20"				// melee
bind b "impulse 64"				// NetSend: throw LOL.BAT (fun gun 4)
bind n "impulse 64"				// NetSend: throw LOL.BAT (fun gun 4)
bind u "impulse 65"				// Dookie Bazooka MK-IV: hold fire to wind up, release to blast (fun gun 5)
bind g "impulse 66"				// Wheelman Cannon: hold fire to charge (fun gun 6)
bind z "impulse 68"				// The Pocket Kyle: hold fire to lock on (2x vs John Bird), release to yeet (fun gun 8)
bind c "impulse 67"				// M4A1: stand-alone CS 1.6 automatic rifle
bind l "impulse 70"				// Cyrax Net: hold fire to charge and launch the net, click to Bonk Launch (fun gun 10)
bind j "impulse 71"				// jetpack on/off
bind h "impulse 86"				// van / Winged John: get in / get out
bind k "impulse 87"				// van / Winged John: cockpit / chase camera
bind p "impulse 98"				// Winged Breezy-Hair John: summon & fly anywhere / dismount
bind MOUSE4 "impulse 5"
bind MOUSE5 "impulse 3"
bind TAB "+showscores"
bind t "messagemode"
bind y "messagemode2"
bind F1 "addbotenemy"			// add an enemy [BOT] to the match
bind F2 "removebot"				// kick a [BOT] from the match
bind F3 "exec lan_server.cfg"	// join the LAN game (Play.cmd keeps lan_server.cfg up to date)
bind F7 "connect 72.62.241.93:26000"	// join the online Bakersfield Quake server
bind MOUSE3 "+button3"			// binoculars (funguns.qc Binoc_Frame): hold to look through them, the wheel zooms
bind o "+button3"
bind F12 "screenshot"
bind F5 "cmd vote yes"
bind F6 "cmd vote no"
bind ESCAPE "togglemenu"
bind BACKQUOTE "toggleconsole"
bind TILDE "toggleconsole"
