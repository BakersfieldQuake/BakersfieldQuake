// lowmem.cfg - for PCs with under 10 GB of RAM, low free RAM, or integrated/weak graphics.
// The launchers add it automatically (BQ_LOWMEM=1 forces it on, BQ_LOWMEM=0 off; see also ultralow.cfg / safemode.cfg).
// By hand: ~ then  exec lowmem  and restart the game. To go back:  exec lowmem_off
//
// Model textures (guns, vehicles, NPCs, pickups) load at half size; world walls, HUD, and menu stay crisp.
// Also enables engine memory-diet cvars (free-before-load, on-demand PVS, lazy render BIH) and caps buffer bloat.

gl_picmip_other 1
r_shadow_shadowmapping_texturesize 1024		// smaller shadow atlas (4 MB instead of 64 MB)
mod_freebeforeload 1				// free old map before loading next (cuts map-change peak ~900 MB)
mod_q1bsp_pvs_ondemand 1			// on-demand PVS LRU cache instead of 116-284 MB dense matrix
mod_q1bsp_lazy_render_bih 1			// defer collision BIH unless realtime lights need it
menu_background 0				// skip background map load to avoid +750 MB map-change spike
r_buffermegs_vertex 8				// reset Zircon's auto-grown archived renderer buffers
r_buffermegs_index16 2
r_buffermegs_index32 2
r_buffermegs_uniform 0.5
r_framedatasize 2
echo "low-memory textures on (exec lowmem_off to undo; restart the game to apply)"
