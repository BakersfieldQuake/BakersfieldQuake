// lowmem.cfg - for PCs with 8 GB of RAM or integrated graphics. The launchers add it by themselves when the PC has
// under 10 GB of RAM; Play.cmd and Start Server.cmd also when no graphics adapter has 3 GB of video memory, with
// lowgpu.cfg once (BQ_LOWMEM=1 forces it on, BQ_LOWMEM=0 off). By hand: ~ then  exec lowmem  and restart the game.
// To go back:  exec lowmem_off
//
// Measured 2026-11-18 on bakersfielddowntown: with the normal settings the game needs about 3.8 GB of its own memory
// and stops with "Mem_Alloc: out of memory" when it cannot get it. With these it needs about 2.5 GB.
// Model textures (guns, vehicles, NPCs, pickups) load at half size. Walls, sprites, the HUD and the menu are untouched.

gl_picmip_other 1
r_shadow_shadowmapping_texturesize 2048		// shadow atlas for rocket / muzzle-flash lights: 16 MB instead of 64 MB
echo "low-memory textures on (exec lowmem_off to undo; restart the game to apply)"
