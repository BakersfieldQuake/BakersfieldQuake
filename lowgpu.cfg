// lowgpu.cfg - starting settings for a PC with weak graphics (integrated graphics, or a card with under 3 GB of its
// own memory). Play.cmd and Start Server.cmd add it ONCE, the first time such a PC starts the game; after that these are
// ordinary saved settings and Options > Simple Mode / Graphics changes them. By hand: ~ then  exec lowgpu  and restart.
// To go back:  exec lowgpu_off   (BQ_LOWGPU=1 forces it on at the next start, BQ_LOWGPU=0 keeps the launcher from adding it)
//
// It is the menu's Simple Mode (same list as BM_Opt_ApplySimpleMode in source/menu_qc/menu_options.qc) plus the two
// settings Simple Mode leaves alone and that cost a weak graphics chip the most: 4x anti-aliasing and 16x filtering.
// Texture memory is handled separately by lowmem.cfg, which the launchers add on the same PCs at every start.

seta lowspec 1
r_bloom 0
r_shadow_realtime_dlight 0
r_shadow_realtime_dlight_shadows 0
r_shadow_gloss 0
r_shadow_glossexact 0
r_shadow_shadowmapping 0
r_glsl_offsetmapping 0
r_glsl_offsetmapping_reliefmapping 0
r_water 0
r_coronas 0
r_glsl_saturation 1
cl_particles_quality 0.5
cl_decals 1
cl_decals_max 128
cl_decals_time 12
cl_decals_fadetime 4
cl_decals_models 0
cl_stainmaps 0
vid_samples 1				// no anti-aliasing (the normal setting is 4)
gl_texture_anisotropy 4		// the normal setting is 16
echo "weak-graphics settings on (exec lowgpu_off to undo; restart the game to apply)"
