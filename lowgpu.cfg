// lowgpu.cfg - starting settings for a PC with weak/integrated graphics (<3 GB real VRAM or iGPU).
// Applied once on weak GPUs (and persisted after clean exit); after that Options > Simple Mode / Graphics controls them.
// By hand: ~ then  exec lowgpu  and restart. To undo:  exec lowgpu_off
// (BQ_LOWGPU=1 forces it on at the next start, BQ_LOWGPU=0 skips it.)

seta lowspec 1
r_bloom 0
r_shadow_realtime_dlight 0
r_shadow_realtime_dlight_shadows 0
r_shadow_gloss 0
r_shadow_glossexact 0
r_shadow_shadowmapping 0
r_shadow_usenormalmap 0
r_load_normalmap 0
r_load_gloss 0
r_glsl_offsetmapping 0
r_glsl_offsetmapping_reliefmapping 0
r_glsl_deluxemapping 0
r_water 0
r_coronas 0
r_glsl_saturation 1
cl_particles_quality 0.5
cl_decals 1
cl_decals_max 128
cl_decals_time 12
cl_decals_fadetime 4
cl_decals_models 0
cl_stainmaps 0
vid_samples 1				// no anti-aliasing (the normal setting is 4)
gl_texture_anisotropy 4		// the normal setting is 16
cl_maxfps 60				// reduce GPU/thermal load on laptops and integrated graphics
echo "weak-graphics settings on (exec lowgpu_off to undo; restart the game to apply)"
