                                          "sound/robhead/rd_grenade.wav", "sound/robhead/rd_chatter_rob.wav",
                                          "sound/robhead/rd_chatter_paul.wav", "sound/robhead/rd_buh.wav",
                                          "sound/robhead/rd_chicken.wav", "sound/robhead/rd_fart.wav",
                                          "sound/robhead/rd_missed.wav", "sound/eric_cannon/canislupusfantasy1.wav",
                                          "sound/wcannon/wc_lrun13.wav", "sound/megaman/boom28.wav",
                                          "sound/funny/fart2.wav", "sound/dookie/dk_dotdot.wav")),
          ):
              pk3_path = os.path.join(root, "BakersfieldQuake", pk3_name)
              if not os.path.isfile(pk3_path):
                  errors.append(f"missing BakersfieldQuake/{pk3_name}")
                  continue
              with zipfile.ZipFile(pk3_path) as z:
                  names = set(z.namelist())
              for req in reqs:
                  if req not in names:
                      errors.append(f"{pk3_name} lacks {req}")

          print(f"{len(maps)} map files in the package; server.cfg wants: {' '.join(dict.fromkeys(wanted))}")
          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          EOF

      - name: Release tag
        run: |
          tag="${NEW_TAG:-v1.${GITHUB_RUN_NUMBER}}"
          [ "$DRAFT" = true ] && tag="${tag}-draft"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Release tag: $tag"
          # Shown in game, bottom right (quake.rc: showdate + exec version.cfg), so a player can see an update landed.
          # Kept short (v1.<run>): it is right-aligned and a longer string runs over the status bar.
          printf '// Written by build-zip.yml: the release this game data comes from.\nset showdate_format "%s"\n' "${tag#build-}" \
              > out/BAKOQUAKE/BakersfieldQuake/version.cfg
          cat out/BAKOQUAKE/BakersfieldQuake/version.cfg

      - name: Zip the Windows package (master)
        # pk3/pak/png are already compressed: store them instead of deflating 1 GB again.
        # This is the asset source for the next run, so its name and tree stay exactly as before.
        run: |
          cd out
          zip -q -r -n .pk3:.pak:.png:.jpg:.ogg ../BAKOQUAKE.zip BAKOQUAKE
          cd ..
          ls -l BAKOQUAKE.zip

      - name: Base pk3 guard
        # Players download only changed files; the base pk3s are ~920 MB. Warn (not fail) if either differs
        # from the latest published release. Content belongs in zz_<feature>.pk3 overlays (AGENTS.md).
        run: |
          python repo/source/ci/base_pk3_guard.py "$GITHUB_REPOSITORY" BAKOQUAKE.zip \
            BAKOQUAKE/BakersfieldQuake/bakersfield.pk3 BAKOQUAKE/quake15/q15.pk3

      - name: Zip the Linux and macOS packages
        # Derive each from the master zip (no second 1 GB tree on disk, no recompressing assets):
        # strip the Windows-only entries, then add that OS's root darkplaces-sdl/-dedicated binaries.
        # Both platforms use the same root names, so they must be separate zips.
        run: |
          make_os_zip() {
            local out_zip="$1" sdl="$2" ded="$3"
            cp BAKOQUAKE.zip "$out_zip"
            # Remove the Windows engine/ tree recursively (including engine/bin64/*.dll), then use -ws
            # (wildcards stop at '/') so only root-level Windows files and tools/bq-update.exe go.
            zip -q -d "$out_zip" 'BAKOQUAKE/engine/*' 'BAKOQUAKE/engine/' || true
            zip -q -d -ws "$out_zip" \
              'BAKOQUAKE/*.exe' 'BAKOQUAKE/*.dll' 'BAKOQUAKE/*.cmd' 'BAKOQUAKE/*.bat' 'BAKOQUAKE/tools/bq-update.exe' || true
            rm -rf stage && mkdir -p stage/BAKOQUAKE
            cp "eng/$sdl" stage/BAKOQUAKE/darkplaces-sdl
            cp "eng/$ded" stage/BAKOQUAKE/darkplaces-dedicated
            chmod +x stage/BAKOQUAKE/darkplaces-sdl stage/BAKOQUAKE/darkplaces-dedicated
            (cd stage && zip -q -g -X "../$out_zip" BAKOQUAKE/darkplaces-sdl BAKOQUAKE/darkplaces-dedicated)
            ls -l "$out_zip"
          }
          make_os_zip BAKOQUAKE-linux-x86_64.zip  zircon_beta_linux_sdl       zircon_beta_linux_dedicated_server
          make_os_zip BAKOQUAKE-macos-arm64.zip   zircon_beta_macos_arm64_sdl zircon_beta_macos_arm64_dedicated_server

      # The signed app bundle holds the engine (pinned by ZIRCON_REF in build_app.sh), the launcher, the frozen updater
      # and the icon; game data reaches it through its own updater (manifest-macos-app.json). So a new DMG is only
      # built when one of those bundle inputs changed since the newest release that has a DMG. Every release records
      # the hash of those inputs in a hidden <!-- mac-inputs: ... --> note; a missing note counts as changed.
      - name: Decide whether the macOS app needs a new DMG
        id: mac
        run: |
          inputs=$(cd repo && git ls-files -z source/mac tools/bq_update.py tools/bq_display.py source/icons/bakoquake-256.png source/icons/bakoquake-update-256.png | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "MAC_INPUTS=$inputs" >> "$GITHUB_ENV"
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
          build=true why="started by hand"
          prev_tag=""
          prev_mac_inputs=""
          for t in $(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts -L 20 --json tagName -q '.[].tagName'); do
            gh release view "$t" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx BAKOQUAKE-macos-arm64.dmg || continue
            prev_tag="$t"
            prev_mac_inputs=$(gh release view "$t" -R "$GITHUB_REPOSITORY" --json body -q .body | sed -n 's/.*<!-- mac-inputs: \(.*\) -->.*/\1/p' | head -1)
            break
          done
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            if [ -n "$prev_mac_inputs" ] && [ "$prev_mac_inputs" = "$inputs" ]; then
              build=false why="app inputs unchanged since the newest release with a DMG"
            else
              old=${prev_mac_inputs:0:12}; why="app inputs ${inputs:0:12}, the newest DMG has ${old:-none recorded}"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "PREV_DMG_TAG=$prev_tag" >> "$GITHUB_ENV"
          echo "PREV_MAC_INPUTS=$prev_mac_inputs" >> "$GITHUB_ENV"
          echo "macOS app build: $build ($why)"

      - name: Write updater manifests
        # One per platform zip: every file's size and sha256, plus the tag-specific zip URL and VPS fallback base.
        # Players' updaters fetch releases/latest/download/manifest-<platform>.json (falling back to the VPS) and pull
        # changed/missing files via Range requests or VPS sha256 blobs. build = run number (never rolls back).
        run: |
          notes=$(cd repo && git log -n 5 --no-merges --pretty=format:"• %s" | head -c 320)
          vps="https://bakersfield.larrywew.fun/updates"
          dl="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          for pair in BAKOQUAKE.zip:windows-x64 BAKOQUAKE-linux-x86_64.zip:linux-x86_64 BAKOQUAKE-macos-arm64.zip:macos-arm64; do
            z="${pair%%:*}" plat="${pair##*:}"
            python -I repo/source/ci/make_manifest.py "$z" "$dl/$z" "$GITHUB_RUN_NUMBER" "$TAG" \
              --notes "$notes" --vps-base "$vps" > "manifest-$plat.json"
            python -c "import json,sys; m=json.load(open(sys.argv[1])); print(sys.argv[1], len(m['files']), 'files')" "manifest-$plat.json"
          done
          # Carry forward the latest published DMG metadata into manifest-macos-app.json so Mac users are not blocked
          # while a new DMG builds/notarizes; the macos job patches this manifest once notarization finishes.
          dmg_args=()
          if [ -n "${PREV_DMG_TAG:-}" ]; then
            rm -f prev_mac_manifest.json
            if gh release download "$PREV_DMG_TAG" -R "$GITHUB_REPOSITORY" -p manifest-macos-app.json -O prev_mac_manifest.json >/dev/null 2>&1; then
              readarray -t prev_meta < <(python -c 'import json; m=json.load(open("prev_mac_manifest.json", encoding="utf-8")); print("\n".join(str(m.get(k, "") or "") for k in ("mac_inputs", "dmg_url", "dmg_vps_url", "dmg_size", "dmg_sha256")))')
              [ -n "${prev_meta[0]}" ] && dmg_args+=(--mac-inputs "${prev_meta[0]}")
              [ -n "${prev_meta[1]}" ] && dmg_args+=(--dmg-url "${prev_meta[1]}")
              [ -n "${prev_meta[2]}" ] && dmg_args+=(--dmg-vps-url "${prev_meta[2]}")
              [ -n "${prev_meta[3]}" ] && dmg_args+=(--dmg-size "${prev_meta[3]}")
              [ -n "${prev_meta[4]}" ] && dmg_args+=(--dmg-sha256 "${prev_meta[4]}")
            fi
          fi
          z=BAKOQUAKE-macos-arm64.zip
          python -I repo/source/ci/make_manifest.py "$z" "$dl/$z" "$GITHUB_RUN_NUMBER" "$TAG" \
            --only BakersfieldQuake/ --only quake15/ --only tools/ \
            --notes "$notes" --vps-base "$vps" --app-inputs "$MAC_INPUTS" "${dmg_args[@]}" > manifest-macos-app.json
          python -c "import json,sys; m=json.load(open(sys.argv[1])); print(sys.argv[1], len(m['files']), 'files')" manifest-macos-app.json

      - name: Publish release
        id: publish
        env:
          MAC_BUILD: ${{ steps.mac.outputs.build }}
        run: |
          tag="$TAG"
          if [ "$MAC_BUILD" = true ]; then
            dmgnote="The DMG is added a few minutes after the other files, once notarization finishes. <!-- dmg: expected -->"
          fi
          assets=(BAKOQUAKE.zip BAKOQUAKE-linux-x86_64.zip BAKOQUAKE-macos-arm64.zip manifest-windows-x64.json manifest-linux-x86_64.json manifest-macos-arm64.json manifest-macos-app.json)
          # No new DMG: copy the newest one forward, so every release (and releases/latest/download/) has a DMG.
          # The copied release's mac-inputs note matches that DMG, so the next run's DMG check still works.
          if [ "$MAC_BUILD" != true ]; then
            if [ -n "${PREV_DMG_TAG:-}" ] && gh release download "$PREV_DMG_TAG" -R "$GITHUB_REPOSITORY" -p BAKOQUAKE-macos-arm64.dmg --clobber; then
              assets+=(BAKOQUAKE-macos-arm64.dmg)
              dmgnote="Same DMG as ${PREV_DMG_TAG} (the app bundle did not change); the app updates its game data on launch."
            else
              echo "::warning::could not copy the DMG from ${PREV_DMG_TAG:-<no release with a DMG>}"
              dmgnote="No DMG in this release: use the DMG from an earlier release, the app updates its game data on launch."
            fi
          fi
          flags=(--latest)
          [ "$DRAFT" = true ] && flags=(--draft)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release create "$tag" "${assets[@]}" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${flags[@]}" \
            --title "$tag" \
            --notes "Playable packages, built by the Build release packages workflow from ${BASE} + repo ${GITHUB_SHA::7} (progs.dat, menu.dat, csprogs.dat, configs, zz_bakovan.pk3, zz_karts.pk3, zz_gunnomip.pk3, zz_minimap.pk3, zz_pinklady.pk3, zz_kyle.pk3, zz_wewcannon.pk3, zz_rocketrider.pk3, zz_johnbird.pk3, zz_quakedesk.pk3, zz_player_deaths.pk3, zz_robdrone.pk3, zz_jumppads.pk3, zz_hitsound.pk3, zz_levelshots.pk3, zz_m4.pk3, zz_netsend_disk.pk3, zz_netsend_sentry.pk3, zz_cyrax.pk3, zz_hats.pk3, zz_gunwheel.pk3, bakersfielddowntown.bsp, bakersfielddowntown_lite.bsp). Windows/Linux/macOS engine from ${ENGINE_REPO}@${ENGINE}. <!-- mac-inputs: ${MAC_INPUTS} -->

          Already installed? Play and Start Server (Windows, Linux) and the macOS app verify all game assets on launch and prompt to update whenever files changed or are missing (GitHub with VPS fallback).

          You need your own copy of Quake (Steam or GOG). On first run the launcher finds its pak0.pak/pak1.pak and copies them into id1; if it can't, copy them there yourself.

          - **Windows** - BAKOQUAKE.zip - unzip, run PLAY BAKERSFIELDQUAKE.exe (or Update.exe to check/repair)
          - **Linux** - BAKOQUAKE-linux-x86_64.zip - needs system SDL2 (e.g. sudo apt install libsdl2-2.0-0); run ./Play.sh (or ./Update.sh)
          - **macOS (Apple Silicon)** - BAKOQUAKE-macos-arm64.dmg - open it, drag BAKOQUAKE and Update BAKOQUAKE to Applications (macOS 13+). ${dmgnote}"

      - name: Sync fallback files to VPS
        if: inputs.draft != true
        env:
          VPS_SYNC_HOST: ${{ secrets.VPS_SYNC_HOST }}
          VPS_SYNC_USER: ${{ secrets.VPS_SYNC_USER }}
          VPS_SYNC_KEY: ${{ secrets.VPS_SYNC_KEY }}
          VPS_SYNC_PORT: ${{ secrets.VPS_SYNC_PORT }}
          VPS_SYNC_DIR: ${{ secrets.VPS_SYNC_DIR }}
        run: |
          python -I repo/source/ci/sync_vps.py \
            --manifests manifest-windows-x64.json manifest-linux-x86_64.json manifest-macos-arm64.json manifest-macos-app.json \
            --zips BAKOQUAKE.zip BAKOQUAKE-linux-x86_64.zip BAKOQUAKE-macos-arm64.zip

  # Signed, notarized BAKOQUAKE.app in a DMG, built from the macOS zip just published. The engine and every dylib
  # it loads are built from pinned sources (see source/mac/build_app.sh). Runs on the self-hosted Mac ozzy-2, a
  # persistent machine: Xcode is asserted below, cmake is pinned through pip, and the signing keychain is removed
  # after every run.
  macos:
    needs: build
    if: needs.build.outputs.mac == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      XCODE_VERSION: "26.3"   # bump together with Xcode on ozzy-2; the deps cache key includes it
      WORK: ${{ github.workspace }}/.bq-mac   # inside the workspace: actions/cache rejects ".." paths
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # ozzy-2 is a persistent machine: fail loudly if Xcode was updated under us, and take cmake (a build tool,
      # nothing of it ends up in the bundle) from a pinned wheel instead of whatever is installed there.
      # Python comes from uv (python-build-standalone, built for macOS 11.0), not actions/setup-python, which
      # hard-codes /Users/runner/hostedtoolcache on macOS. It freezes tools/bq_update.py into the app, and
      # build_app.sh checks its libraries target macOS 13.0 like everything else in the bundle.
      - name: Check toolchain
        run: |
          v=$(xcodebuild -version | awk 'NR==1 {print $2}')
          [ "$v" = "$XCODE_VERSION" ] || { echo "::error::Xcode is $v, the workflow pins $XCODE_VERSION"; exit 1; }
          uv python install 3.12
          echo "PYTHON=$(uv python find --managed-python 3.12)" >> "$GITHUB_ENV"
          uv venv -q --python 3.12 --managed-python "$RUNNER_TEMP/tools"
          uv pip install -q --python "$RUNNER_TEMP/tools/bin/python" cmake==3.31.6
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tools/bin/cmake" --version | head -1
          gh --version | head -1

      - name: Cache source-built dylibs
        id: cache_macdeps
        # Keyed on the script, which holds every pinned version.
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.bq-mac/prefix-13.0
          key: bq-mac-deps-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('source/mac/build_app.sh') }}

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user | xargs security list-keychains -d user -s "$kc"
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$kc"

      - name: Build, sign, notarize, upload DMG
        env:
          MAC_INPUTS: ${{ needs.build.outputs.mac_inputs }}
        run: UPLOAD=1 source/mac/build_app.sh "${{ needs.build.outputs.tag }}"

      - name: Save source-built dylibs cache
        if: steps.cache_macdeps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.bq-mac/prefix-13.0
          key: ${{ steps.cache_macdeps.outputs.cache-primary-key }}

      - name: Sync macOS DMG and manifest to VPS
        if: needs.build.outputs.draft != 'true'
        env:
          VPS_SYNC_HOST: ${{ secrets.VPS_SYNC_HOST }}
          VPS_SYNC_USER: ${{ secrets.VPS_SYNC_USER }}
          VPS_SYNC_KEY: ${{ secrets.VPS_SYNC_KEY }}
          VPS_SYNC_PORT: ${{ secrets.VPS_SYNC_PORT }}
          VPS_SYNC_DIR: ${{ secrets.VPS_SYNC_DIR }}
        run: |
          if [ -f "$WORK/out/manifest-macos-app.json" ] && [ -f "$WORK/out/BAKOQUAKE-macos-arm64.dmg" ]; then
            "$PYTHON" -I source/ci/sync_vps.py \
              --dmg "$WORK/out/BAKOQUAKE-macos-arm64.dmg" \
              --manifest "$WORK/out/manifest-macos-app.json"
          fi

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
