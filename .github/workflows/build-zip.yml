          bd_bsp = os.path.join(root, "BakersfieldQuake", "maps", "bakersfielddowntown.bsp")
          if os.path.isfile(bd_bsp):
              with open(bd_bsp, "rb") as fh:
                  hdr = fh.read(12)
                  l0_ofs, l0_len = struct.unpack_from("<2i", hdr, 4)
                  fh.seek(l0_ofs)
                  l0_txt = fh.read(l0_len).rstrip(b"\x00").decode("latin-1")
              n_qdesk = l0_txt.count('"mdl" "progs/qdesk_b.md3"')
              if n_qdesk != 18:
                  errors.append(f"bakersfielddowntown.bsp expected 18 progs/qdesk_b.md3 LAN desks, found {n_qdesk}")
              n_qdesk_cls = l0_txt.count('"classname" "misc_lan_quakedesk"')
              if n_qdesk_cls != 18:
