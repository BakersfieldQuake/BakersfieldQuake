          python -I repo/source/mm_tools/disc_sentry/build_netsend_sentry_pk3.py --out pk3cache/zz_netsend_sentry.pk3 --verify-repro

      - name: Save zz_netsend_sentry.pk3 cache
        if: steps.cache_netsend_sentry.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: pk3cache/zz_netsend_sentry.pk3
          key: ${{ steps.cache_netsend_sentry.outputs.cache-primary-key }}

      - name: Build zz_cyrax.pk3
        # Cyrax Net Launcher (MK3 robotic blaster viewmodel, flying/wrapping green net MD3s, shaders & SFX)
        if: steps.cache_cyrax.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
          python -I repo/source/mm_tools/cyrax/build_cyrax_pk3.py --out pk3cache/zz_cyrax.pk3 --verify-repro

      - name: Save zz_cyrax.pk3 cache
        if: steps.cache_cyrax.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: pk3cache/zz_cyrax.pk3
          key: ${{ steps.cache_cyrax.outputs.cache-primary-key }}

      - name: Hash levelshot inputs
        # zz_levelshots.pk3 is made from the base package's levelshots/*.jpg plus the one in zz_bakersfieldish.pk3
        run: |
          shots=$( { LC_ALL=C sha256sum out/BAKOQUAKE/BakersfieldQuake/levelshots/*.jpg; sha256sum pk3cache/zz_bakersfieldish.pk3 | awk '{print $1}'; } | sha256sum | awk '{print $1}')
          echo "LEVELSHOTS_INPUT_SHA256=$shots" >> "$GITHUB_ENV"

      - name: Cache zz_levelshots.pk3
        id: cache_levelshots
        uses: actions/cache/restore@v6
        with:
          path: pk3cache/zz_levelshots.pk3
          key: zz_levelshots-${{ env.LEVELSHOTS_INPUT_SHA256 }}-pillow13.0.0-${{ hashFiles('repo/source/mm_tools/build_levelshots_pk3.py') }}

      - name: Build zz_levelshots.pk3
        # PNG copies of the map levelshots: Zircon can't decode the .jpg ones without a jpeg62 library, so the Host
        # Game cards came up empty (playtest 1.76). menu_ui.qc prefers levelshots/<map>.png.
        if: steps.cache_levelshots.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
          python -m pip install --quiet numpy==2.5.4 pillow==13.0.0   # pinned: a pillow change alters PNG bytes
          python -I repo/source/mm_tools/build_levelshots_pk3.py out/BAKOQUAKE/BakersfieldQuake pk3cache/zz_levelshots.pk3 --pk3 pk3cache/zz_bakersfieldish.pk3 --verify-repro

      - name: Save zz_levelshots.pk3 cache
        if: steps.cache_levelshots.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: pk3cache/zz_levelshots.pk3
          key: ${{ steps.cache_levelshots.outputs.cache-primary-key }}

      - name: Build zz_gunwheel.pk3
        # The Gun Wheel icons (source/mm_tools/gunwheel/assets). Only zips committed PNGs, so it needs no cache.
        run: |
          mkdir -p pk3cache
          python -I repo/source/mm_tools/gunwheel/build_gunwheel_pk3.py pk3cache/zz_gunwheel.pk3

      - name: Build zz_selected_sounds.pk3
        # Enhanced custom voice/SFX clips (source/mm_tools/selected_sounds/assets). Pure stdlib zip, needs no cache.
        run: |
          mkdir -p pk3cache
          python -I repo/source/mm_tools/selected_sounds/build_selected_sounds_pk3.py pk3cache/zz_selected_sounds.pk3 --verify-repro

      - name: Fetch zz_netsend_disk.pk3
        # THE DISK viewmodel for the NetSend gun (set A "Frisbee Pro", picked by vote 2026-11-26) and its thrown disk.
        # Its frames are keyed from videos that are not in the repo, so the pk3 is built locally
        # (docs/netsend_disk_vote/README.md) and pinned here by sha256. The name carries the hash, so a new build is a
        # new file on the VPS and a new pin here; source/qc_combat_decomp/netsend_diskvm.qc must match the same set.
        run: |
          mkdir -p pk3cache
          curl -fsSL --retry 3 -o pk3cache/zz_netsend_disk.pk3 https://bakersfield.larrywew.fun/pk3/zz_netsend_disk-e557aa2b.pk3
          echo "e557aa2b2488481fb753296f8ca13124d873d0a0ceb65ccf2b1d7f77b745712d  pk3cache/zz_netsend_disk.pk3" | sha256sum -c -

      - name: Fetch zz_hats.pk3
        # Player hats and the head table behind source/qc_combat_decomp/bm_hat_tags.qc. Their builder is not in the
        # repo yet, so the built pk3 is pinned by sha256. The name carries the hash: a new build is a new file on
        # the VPS and a new pin here, with bm_hat_tags.qc regenerated (source/mm_tools/gen_bm_hat_tags.py).
        run: |
          mkdir -p pk3cache
          curl -fsSL --retry 3 -o pk3cache/zz_hats.pk3 https://bakersfield.larrywew.fun/pk3/zz_hats-5522f13f.pk3
          echo "5522f13ffc5203c1a08807357b1932d4fa06ca03154b347f9e60c2a541955bb5  pk3cache/zz_hats.pk3" | sha256sum -c -

      - name: Add overlay pk3s to the package
        run: |
          cp pk3cache/zz_bakovan.pk3 pk3cache/zz_karts.pk3 pk3cache/zz_gunnomip.pk3 pk3cache/zz_minimap.pk3 pk3cache/zz_pinklady.pk3 pk3cache/zz_kyle.pk3 pk3cache/zz_wewcannon.pk3 pk3cache/zz_rocketrider.pk3 pk3cache/zz_johnbird.pk3 pk3cache/zz_quakedesk.pk3 pk3cache/zz_dn3shotgun.pk3 pk3cache/zz_foreloco.pk3 pk3cache/zz_triple_wheeled.pk3 pk3cache/zz_dn3fx.pk3 pk3cache/zz_loading.pk3 pk3cache/zz_bakersfieldish.pk3 pk3cache/zz_player_deaths.pk3 pk3cache/zz_robdrone.pk3 pk3cache/zz_jumppads.pk3 pk3cache/zz_hitsound.pk3 pk3cache/zz_levelshots.pk3 pk3cache/zz_m4.pk3 pk3cache/zz_netsend_disk.pk3 pk3cache/zz_netsend_sentry.pk3 pk3cache/zz_cyrax.pk3 pk3cache/zz_hats.pk3 pk3cache/zz_gunwheel.pk3 pk3cache/zz_selected_sounds.pk3 out/BAKOQUAKE/BakersfieldQuake/
          sha256sum pk3cache/*.pk3

      - name: Cache fteqcc
        id: cache_fteqcc
        uses: actions/cache/restore@v6
        with:
          path: qcccache/fteqcc.bin
          key: fteqcc-linux-x86_64-${{ env.FTEQW_REF }}

      - name: Build fteqcc
        if: steps.cache_fteqcc.outputs.cache-hit != 'true'
        run: |
          pkg-config --exists zlib || (sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev)
          mkdir -p qcccache fteqw
          git init -q fteqw
          git -C fteqw fetch -q --depth 1 https://github.com/fte-team/fteqw "$FTEQW_REF"
          git -C fteqw checkout -q FETCH_HEAD
          make -C fteqw/engine/qclib -j"$(nproc)" qcc
          cp fteqw/engine/qclib/fteqcc.bin qcccache/fteqcc.bin
          chmod +x qcccache/fteqcc.bin
          rm -rf fteqw

      - name: Save fteqcc cache
        if: steps.cache_fteqcc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: qcccache/fteqcc.bin
          key: ${{ steps.cache_fteqcc.outputs.cache-primary-key }}

      - name: Compile QuakeC (progs.dat, menu.dat, csprogs.dat)
        run: |
          QCC="$PWD/qcccache/fteqcc.bin"
          chmod +x "$QCC"
          rm -rf qc_build && mkdir -p qc_build
          cp -R repo/source/qc_combat_decomp repo/source/menu_qc qc_build/
          compile_qc() {
            local d="$1" out_name="$2" dest="$3"
            rm -f "$d/$out_name"
            (cd "$d" && "$QCC" -srcfile progs.src) >"$d.log" 2>&1 || {
              grep -i error "$d.log" | head -40
              tail -40 "$d.log"
              exit 1
            }
            test -s "$d/$out_name" || { echo "::error::$d produced empty or missing $out_name"; exit 1; }
            cp "$d/$out_name" "$dest"
            echo "compiled $(basename "$dest") ($(wc -c < "$dest") bytes, $(grep -c warning "$d.log" || true) warnings)"
          }
          G=out/BAKOQUAKE/BakersfieldQuake
          compile_qc qc_build/qc_combat_decomp progs.dat "$G/progs.dat"
          compile_qc qc_build/menu_qc menu.dat "$G/menu.dat"
          compile_qc qc_build/qc_combat_decomp/csqc progs.dat "$G/csprogs.dat"
          # Stamp back quake15/csprogs.dat header CRC (as source/mm_tools/assemble_local_package.sh & build_csqc.py do).
          python -I - out/BAKOQUAKE/quake15/csprogs.dat "$G/csprogs.dat" <<'PY'
          import struct, sys
          crc = struct.unpack_from("<i", open(sys.argv[1], "rb").read(), 4)[0]
          d = bytearray(open(sys.argv[2], "rb").read())
          struct.pack_into("<i", d, 4, crc)
          open(sys.argv[2], "wb").write(d)
          print(f"csprogs.dat header CRC set to {crc}")
          PY
          sha256sum "$G/progs.dat" "$G/menu.dat" "$G/csprogs.dat"
          rm -rf qc_build

      - name: Check the package
        # Fails the run before anything is zipped or published when the package could not start a game or a server.
        run: |
          python -I - out/BAKOQUAKE <<'EOF'
          import os, re, struct, sys, zipfile

          root = sys.argv[1]
          errors = []

          for rel in ("BakersfieldQuake/progs.dat", "BakersfieldQuake/menu.dat", "BakersfieldQuake/csprogs.dat",
                      "BakersfieldQuake/ultralow.cfg", "BakersfieldQuake/safemode.cfg",
                      "engine/zircon_beta_gcc.exe", "Update.exe", "Update.sh", "Report a Problem.cmd", "Display Settings.cmd",
                      "tools/find-quake-paks.ps1", "tools/find-quake-paks.sh",
                      "tools/bq-preflight.ps1", "tools/bq-report.ps1",
                      "tools/bq_update.py", "tools/bq_display.py", "tools/install-shortcuts.ps1",
                      "tools/install-shortcuts.sh", "tools/bakoquake.ico", "tools/bakoquake-256.png",
                      "tools/bakoquake-update.ico", "tools/bakoquake-update-256.png"):
              p = os.path.join(root, rel)
              if not os.path.isfile(p) or os.path.getsize(p) == 0:
                  errors.append(f"missing or empty {rel}")
          progs_path = os.path.join(root, "BakersfieldQuake", "progs.dat")
          if os.path.isfile(progs_path):
              progs_raw = open(progs_path, "rb").read()
              for marker in (b"misc_vehicle_rocketrider", b"progs/rocket_rider.md3", b"progs/rocket_rider_rider.md3"):
                  if marker not in progs_raw:
                      errors.append(f"BakersfieldQuake/progs.dat missing expected symbol/string {marker.decode('ascii')}")
          # the launchers copy progs/v_light.mdl out of the player's own pak0.pak: it is id Software's file
          for game in ("id1", "quake15", "BakersfieldQuake"):
              for d, _, files in os.walk(os.path.join(root, game)):
                  for f in files:
                      rel = os.path.relpath(os.path.join(d, f), root).replace(os.sep, "/")
                      if rel.lower().endswith("/progs/v_light.mdl"):
                          errors.append(f"{rel} may be id Software's model and must not ship")
          for rel in ("id1/pak0.pak", "id1/pak1.pak"):
              if os.path.exists(os.path.join(root, rel)):
                  errors.append(f"{rel} is id Software's paid Quake data and must not ship (the launchers find the player's own)")

          # Every map the package holds: loose maps/*.bsp and maps/ inside the pk3s/paks of each game dir.
          maps = set()
          for game in ("id1", "quake15", "BakersfieldQuake"):
              gdir = os.path.join(root, game)
              if not os.path.isdir(gdir):
                  continue
              if os.path.isdir(os.path.join(gdir, "maps")):
                  maps.update(f.lower() for f in os.listdir(os.path.join(gdir, "maps")))
              for f in os.listdir(gdir):
                  path = os.path.join(gdir, f)
                  if f.lower().endswith(".pk3"):
                      with zipfile.ZipFile(path) as z:
                          maps.update(n[5:].lower() for n in z.namelist() if n.lower().startswith("maps/"))
                  elif f.lower().endswith(".pak"):
                      with open(path, "rb") as fh:
                          magic, off, size = struct.unpack("<4sii", fh.read(12))
                          if magic == b"PACK":
                              fh.seek(off)
                              for _ in range(size // 64):
                                  name = fh.read(64)[:56].split(b"\0")[0].decode("latin-1").lower()
                                  if name.startswith("maps/"):
                                      maps.add(name[5:])

          # server.cfg: the first map (map X) and every map in the bm_maplist rotation.
          cfg = os.path.join(root, "BakersfieldQuake", "server.cfg")
          wanted = []
          if os.path.isfile(cfg):
              for line in open(cfg, encoding="latin-1"):
                  line = line.split("//", 1)[0].strip()
                  m = re.match(r'(?:seta?\s+)?bm_maplist\s+(?:"([^"]*)"|(\S+))', line)
                  if m:
                      wanted += (m.group(1) if m.group(1) is not None else m.group(2)).split()
                  m = re.match(r'(?:map|changelevel)\s+"?([^\s";]+)', line)
                  if m:
                      wanted.append(m.group(1))
          else:
              errors.append("missing BakersfieldQuake/server.cfg")
          for name in dict.fromkeys(wanted):
              if name.lower() + ".bsp" not in maps:
                  errors.append(f"server.cfg names map '{name}' but maps/{name}.bsp is not in the package")

          # quake.rc's key/setting migrations: every exec'd bm_up_N.cfg must ship.
          rc = os.path.join(root, "BakersfieldQuake", "quake.rc")
          if os.path.isfile(rc):
              code = re.sub(r"//[^\n]*", "", open(rc, encoding="latin-1").read())   # the how-to comment names the next bm_up file
              for n in sorted(set(re.findall(r"exec\s+(bm_up_\w+\.cfg)", code))):
                  if not os.path.isfile(os.path.join(root, "BakersfieldQuake", n)):
                      errors.append(f"quake.rc execs {n} but it is not in the package")

          # zz_gunnomip.pk3 replaces three whole shader files of bakersfield.pk3: each must be there, with every shader
          # block still carrying nomipmaps. zz_gunframes.pk3 (the atlas pack) replaces the same files and would lose.
          gunnomip = os.path.join(root, "BakersfieldQuake", "zz_gunnomip.pk3")
          if not os.path.isfile(gunnomip):
              errors.append("missing BakersfieldQuake/zz_gunnomip.pk3")
          else:
              with zipfile.ZipFile(gunnomip) as z:
                  for n in ("scripts/dookievm.shader", "scripts/greenjarvm.shader", "scripts/rh_dronevm.shader"):
                      if n not in z.namelist():
                          errors.append(f"zz_gunnomip.pk3 lacks {n}")
                          continue
                      text = z.read(n).decode("latin-1")
                      blocks, nomip = len(re.findall(r"^\{$", text, re.M)), text.count("\tnomipmaps\n")
                      if not blocks or nomip != blocks:
                          errors.append(f"zz_gunnomip.pk3 {n}: {nomip} of {blocks} shaders have nomipmaps")
          if os.path.exists(os.path.join(root, "BakersfieldQuake", "zz_gunframes.pk3")):
              errors.append("zz_gunframes.pk3 and zz_gunnomip.pk3 replace the same shader files: ship only one")

          if not os.path.isfile(os.path.join(root, "BakersfieldQuake", "zz_minimap.pk3")):
              errors.append("missing BakersfieldQuake/zz_minimap.pk3")

          pinklady = os.path.join(root, "BakersfieldQuake", "zz_pinklady.pk3")
