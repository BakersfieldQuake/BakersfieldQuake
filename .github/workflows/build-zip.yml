      - name: Build zz_netsend_sentry.pk3
        # Classic Retro Style disc sentry gun (base tripod, swiveling PC/CRT/speaker-cannon turret, 3D floppy projectiles & SFX)
        if: steps.cache_netsend_sentry.outputs.cache-hit != 'true'
        run: |
