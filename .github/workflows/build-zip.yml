      - name: Build zz_hitsound.pk3
        # The hit "tink" (sound/misc/mmhit1..3.wav), overriding the copies in bakersfield.pk3
        if: steps.cache_hitsound.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
