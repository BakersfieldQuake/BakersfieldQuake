# Builds the BAKOQUAKE release packages on every push to main (docs-only pushes are skipped), or on demand
# (Actions tab > "Build release packages" > Run workflow). A newer push cancels a build still running for main.
#
# The repo is text/source only, so this does not rebuild the big base pk3s/maps. It takes BAKOQUAKE.zip from an existing
# release (default: the latest), lays this repo's configs over BakersfieldQuake/ and launchers/ over the package
# root, compiles progs.dat, menu.dat and csprogs.dat from repo QC sources with pinned fteqcc, rebuilds
# zz_bakovan.pk3, zz_karts.pk3, zz_gunnomip.pk3, zz_minimap.pk3, zz_pinklady.pk3, zz_kyle.pk3, zz_wewcannon.pk3, zz_rocketrider.pk3, zz_johnbird.pk3, zz_quakedesk.pk3 and zz_dn3shotgun.pk3
# from the zip's own bakersfield.pk3 / repo sources (and patches Dagny's upstairs LAN party into bakersfielddowntown.bsp), then publishes three per-OS packages:
#
#   BAKOQUAKE.zip                 Windows. engine/zircon_beta_gcc.exe from the public engine release.
#   BAKOQUAKE-linux-x86_64.zip    Linux.   darkplaces-sdl + darkplaces-dedicated from the public engine release.
#   BAKOQUAKE-macos-arm64.zip     macOS (Apple Silicon). Same, from the macos-arm64 engine build.
#   BAKOQUAKE-macos-arm64.dmg     macOS app: signed + notarized, built from that zip by the macos job
#                                 (source/mac/build_app.sh). It is added to the release once that job finishes.
#
# The base must be a fresh lan/make_lan_package.ps1 build (Zircon layout, menu.dat, today's maps, no id1 paks): server.cfg
# and quake.rc are only overlaid onto such a base, and "Check the package" fails the run (nothing is published) when
# progs.dat/menu.dat/the engine/a map named in server.cfg is missing, or when id1/pak0.pak or pak1.pak would ship.
#
# Windows, Linux and macOS engine binaries come from the public engine CI repo (GiggleHacks/zircon-darkplaces). On first run every
# launcher looks for the player's own Quake pak0/pak1 (Steam, GOG, usual folders, then Downloads) and copies them into
# id1/ (tools/find-quake-paks.sh / .ps1). Running build-zip on its own output is safe: the same steps give the same files. BAKOQUAKE.zip
# keeps its exact name and tree so the next run can still take it as the base.
name: Build release packages

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
    inputs:
      base_tag:
        description: "Release to take BAKOQUAKE.zip from (empty = latest)"
        required: false
        default: ""
      tag:
        description: "Tag for the new release (empty = v1.<run number>)"
        required: false
        default: ""
      engine_tag:
        description: "Engine release in GiggleHacks/zircon-darkplaces (empty = latest)"
        required: false
        default: ""
      draft:
        description: "Publish as a DRAFT release (safe for testing; excluded from 'latest')"
        type: boolean
        required: false
        default: false

# One release build at a time per branch: a new push cancels the older run. Draft test builds get their own group,
# so they neither cancel nor are cancelled by a release build.
# A run cancelled while publishing can leave a half-made release (tag without the DMG); delete it and re-run.
concurrency:
  group: ${{ inputs.draft == true && github.run_id || 'release' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # tools/bq-update.exe: the updater (tools/bq_update.py) frozen with PyInstaller, so players need no Python.
  # PyInstaller output is not byte-reproducible, so the exe is cached on its inputs: an unchanged updater keeps
  # its exact bytes and players don't re-download it (or run the self-replace path) on every release.
  updater:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Updater tests (on Windows, where file replacement is strictest)
        shell: bash
        timeout-minutes: 5
        run: python -m unittest discover -s source/ci/tests -v

      - name: Cache Update.exe
        id: cache
        uses: actions/cache@v6
        with:
          path: dist/Update.exe
          key: bq-update-win-v3-py3.12-pyinstaller6.22.3-${{ hashFiles('tools/bq_update.py', 'tools/bq_display.py', 'source/icons/bakoquake-update.ico') }}

      - name: Freeze tools/bq_update.py as Update.exe
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --quiet pyinstaller==6.22.3
          python -m PyInstaller --onefile --noconsole --noupx --paths tools --hidden-import bq_display --icon source/icons/bakoquake-update.ico --name Update tools/bq_update.py

      - name: Smoke test
        shell: bash
        run: |
          ./dist/Update.exe --version
          ./dist/Update.exe --help

      - uses: actions/upload-artifact@v7
        with:
          name: bq-update-windows
          path: dist/Update.exe

  build:
    needs: updater
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      mac: ${{ steps.mac.outputs.build }}
      mac_inputs: ${{ steps.mac.outputs.inputs }}
      draft: ${{ inputs.draft == true }}
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_TAG: ${{ inputs.base_tag }}
      NEW_TAG: ${{ inputs.tag }}
      ENGINE_REPO: GiggleHacks/zircon-darkplaces
      ENGINE_TAG: ${{ inputs.engine_tag }}
      FTEQW_REF: c781d13255ce72fcd24e47567244f970e1ba7c50
      DRAFT: ${{ inputs.draft }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: repo
          fetch-depth: 20

      # The concurrency group lets one release build run at a time, so any incomplete draft is from a cancelled run.
      - name: Remove incomplete releases from cancelled runs
        continue-on-error: true
        run: repo/source/ci/cleanup_releases.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download base BAKOQUAKE.zip
        run: |
          base="${BASE_TAG:-$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          echo "Base release: $base"
          echo "BASE=$base" >> "$GITHUB_ENV"
          gh release download "$base" -R "$GITHUB_REPOSITORY" -p BAKOQUAKE.zip
          unzip -q BAKOQUAKE.zip -d out
          rm BAKOQUAKE.zip
          test -f out/BAKOQUAKE/BakersfieldQuake/bakersfield.pk3
          test -f out/BAKOQUAKE/quake15/q15.pk3
          # 2026-11-23: only soi6, soicowboy_bkk, spruce, practice, morrorock, bakersfielddowntown and bklan6 ship; drop the rest
          for m in aerowalk bakersfielddowntown_lite fox goldenwest hart kyle_range little_st_james lolmap1 ooika_lawrenceville slo_bike_kitchen terminal21; do
            rm -f out/BAKOQUAKE/BakersfieldQuake/maps/$m.* out/BAKOQUAKE/BakersfieldQuake/levelshots/$m.jpg
          done
          rm -f out/BAKOQUAKE/BakersfieldQuake/zz_hart.pk3
          base_bakersfield=$(sha256sum out/BAKOQUAKE/BakersfieldQuake/bakersfield.pk3 | awk '{print $1}')
          base_q15=$(sha256sum out/BAKOQUAKE/quake15/q15.pk3 | awk '{print $1}')
          base_maps=$(LC_ALL=C sha256sum out/BAKOQUAKE/BakersfieldQuake/maps/*.bsp | sha256sum | awk '{print $1}')
          base_minimap=$([ -f out/BAKOQUAKE/BakersfieldQuake/zz_minimap.pk3 ] && sha256sum out/BAKOQUAKE/BakersfieldQuake/zz_minimap.pk3 | awk '{print $1}' || echo none)
          base_johnbird=$([ -f out/BAKOQUAKE/BakersfieldQuake/zz_johnbird.pk3 ] && sha256sum out/BAKOQUAKE/BakersfieldQuake/zz_johnbird.pk3 | awk '{print $1}' || echo none)
          echo "Base bakersfield.pk3 SHA-256: $base_bakersfield"
          echo "Base q15.pk3 SHA-256:         $base_q15"
          echo "Base maps/*.bsp SHA-256:      $base_maps"
          echo "Base zz_minimap.pk3 SHA-256:  $base_minimap"
          echo "Base zz_johnbird.pk3 SHA-256: $base_johnbird"
          {
            echo "BASE_BAKERSFIELD_SHA256=$base_bakersfield"
            echo "BASE_Q15_SHA256=$base_q15"
            echo "BASE_MAPS_SHA256=$base_maps"
            echo "BASE_MINIMAP_SHA256=$base_minimap"
            echo "BASE_JOHNBIRD_SHA256=$base_johnbird"
          } >> "$GITHUB_ENV"

      - name: Patch Dagny's upstairs LAN party into bakersfielddowntown.bsp
        run: python -I repo/source/mm_tools/patch_dagnys_lan_bsp.py out/BAKOQUAKE/BakersfieldQuake/maps/bakersfielddowntown.bsp

      - name: Patch ForeLoco powerups into bakersfielddowntown.bsp
        run: python -I repo/source/mm_tools/foreloco/patch_foreloco_maps.py out/BAKOQUAKE/BakersfieldQuake/maps/bakersfielddowntown.bsp

      - name: Download engine binaries from public release
        run: |
          etag="${ENGINE_TAG:-$(gh release view -R "$ENGINE_REPO" --json tagName --jq .tagName)}"
          echo "Engine release: $ENGINE_REPO@$etag"
          echo "ENGINE=$etag" >> "$GITHUB_ENV"
          mkdir -p eng
          # GITHUB_TOKEN can read public releases; if this ever fails, a PAT is needed.
          args=(-p 'zircon-*-linux-x86_64.zip' -p 'zircon-*-macos-arm64.zip' -p 'zircon-*-windows-x86_64.zip')
          gh release download "$etag" -R "$ENGINE_REPO" -D eng "${args[@]}"
          (cd eng && for z in zircon-*.zip; do echo "unzip $z"; unzip -o -q "$z"; done)
          ls -l eng
          test -f eng/zircon_beta_gcc.exe
          win_sz=$(wc -c < eng/zircon_beta_gcc.exe)
          echo "Windows engine eng/zircon_beta_gcc.exe: ${win_sz} bytes"
          if [ "$win_sz" -le 6000000 ]; then
            echo "::error::eng/zircon_beta_gcc.exe is too small (${win_sz} B <= 6000000 B); refusing non-selfpack Windows engine"
            exit 1
          fi
          cp eng/zircon_beta_gcc.exe out/BAKOQUAKE/engine/zircon_beta_gcc.exe
          sha256sum out/BAKOQUAKE/engine/zircon_beta_gcc.exe

      - name: Overlay repo configs
        # lan_server.cfg is written at run time by tools/lanscan.ps1, so the repo copy is not shipped.
        # server.cfg and quake.rc depend on the base's game data (maps, menu.dat, Zircon), so they are only laid over a
        # base built by make_lan_package; on an older base the base's own copies stay (and "Check the package" fails it).
        run: |
          game=out/BAKOQUAKE/BakersfieldQuake
          fresh_base=1
          if [ ! -f "$game/menu.dat" ] || [ ! -f out/BAKOQUAKE/engine/zircon_beta_gcc.exe ]; then
            fresh_base=0
            echo "::warning::Base $BASE is not a make_lan_package (Zircon) build: keeping its own server.cfg and quake.rc."
          fi
          for f in repo/*.cfg repo/quake.rc repo/effectinfo.txt; do
            [ "$(basename "$f")" = lan_server.cfg ] && continue
            case "$(basename "$f")" in server.cfg|quake.rc) [ "$fresh_base" = 1 ] || continue ;; esac
            if ! cmp -s "$f" "$game/$(basename "$f")"; then echo "updated $(basename "$f")"; fi
            cp "$f" "$game/"
          done

      - name: Overlay repo launchers
        run: |
          for f in repo/launchers/*; do
            if ! cmp -s "$f" "out/BAKOQUAKE/$(basename "$f")"; then echo "updated $(basename "$f")"; fi
            cp "$f" out/BAKOQUAKE/
          done

      - name: Overlay repo tools
        # Launcher helpers (e.g. find-quake-paks.sh/.ps1) live in repo/tools/ and ship in the package's tools/,
        # with the shortcut icons from repo/source/icons/ (used by tools/install-shortcuts.ps1/.sh).
        run: |
          mkdir -p out/BAKOQUAKE/tools
          for f in repo/tools/* repo/source/icons/*; do
            if ! cmp -s "$f" "out/BAKOQUAKE/tools/$(basename "$f")"; then echo "updated tools/$(basename "$f")"; fi
            cp "$f" out/BAKOQUAKE/tools/
          done

      - name: Add the Windows updater (root Update.exe)
        uses: actions/download-artifact@v8
        with:
          name: bq-update-windows
          path: out/BAKOQUAKE

      - name: Remove legacy tools/bq-update.exe from base zip
        run: rm -f out/BAKOQUAKE/tools/bq-update.exe

      # Overlay pk3s are reproducible, so each is cached and only rebuilt when an input changes. The key holds the
      # base bakersfield.pk3 (all of them read it), the pinned numpy/pillow where used, and every source file the builder reads.
      # A builder that starts reading a new file must add it to its key, or a stale pk3 gets reused.
      - name: Cache zz_bakovan.pk3
        id: cache_bakovan
        uses: actions/cache@v6
        with:
          path: pk3cache/zz_bakovan.pk3
          key: zz_bakovan-${{ env.BASE_BAKERSFIELD_SHA256 }}-numpy2.5.4-pillow13.0.0-${{ hashFiles('repo/source/mm_tools/van_bako/build_van_bako_pk3.py', 'repo/source/mm_tools/van_bako/van_front_bako.png') }}

      - name: Cache zz_karts.pk3
        id: cache_karts
        uses: actions/cache@v6
        with:
          path: pk3cache/zz_karts.pk3
          key: zz_karts-${{ env.BASE_BAKERSFIELD_SHA256 }}-numpy2.5.4-pillow13.0.0-${{ hashFiles('repo/source/mm_tools/build_gokart_pk3.py', 'repo/source/mm_tools/gokart_*.py', 'repo/source/mm_tools/md3lib.py', 'repo/source/mm_tools/mmw_geometry.py', 'repo/source/mm_tools/tank_geom_core.py', 'repo/source/mm_tools/tank_tex_gen.py', 'repo/source/mm_tools/id1/player.mdl', 'repo/scripts/gokart.shader') }}

      - name: Cache zz_gunnomip.pk3
        # Standard library only (no numpy/pillow) and stored entries, so the key is the base pack and the builder.
        id: cache_gunnomip
        uses: actions/cache@v6
        with:
          path: pk3cache/zz_gunnomip.pk3
          key: zz_gunnomip-${{ env.BASE_BAKERSFIELD_SHA256 }}-${{ hashFiles('repo/source/mm_tools/build_gunnomip_pk3.py') }}

      - name: Cache zz_minimap.pk3
        id: cache_minimap
        uses: actions/cache@v6
        with:
          path: pk3cache/zz_minimap.pk3
          key: zz_minimap-${{ env.BASE_BAKERSFIELD_SHA256 }}-${{ env.BASE_Q15_SHA256 }}-${{ env.BASE_MAPS_SHA256 }}-${{ env.BASE_MINIMAP_SHA256 }}-numpy2.5.4-pillow13.0.0-${{ hashFiles('repo/source/mm_tools/build_minimap_pk3.py') }}

      - name: Cache zz_pinklady.pk3
        id: cache_pinklady
        uses: actions/cache@v6
        with:
          path: pk3cache/zz_pinklady.pk3
          key: zz_pinklady-${{ env.BASE_BAKERSFIELD_SHA256 }}-numpy2.5.4-pillow13.0.0-${{ hashFiles('repo/source/mm_tools/build_pinklady_pk3.py') }}

      - name: Cache zz_kyle.pk3
        id: cache_kyle
        uses: actions/cache@v6
        with:
          path: pk3cache/zz_kyle.pk3
          key: zz_kyle-numpy2.5.4-pillow13.0.0-${{ hashFiles('repo/source/mm_tools/kyle_scissors/build_kyle_pk3.py', 'repo/source/mm_tools/md3lib.py', 'repo/source/mm_tools/kyle_scissors/assets/**') }}

      - name: Cache zz_rocketrider.pk3
        id: cache_rocketrider
        uses: actions/cache@v6
        with:
          path: pk3cache/zz_rocketrider.pk3
          key: zz_rocketrider-numpy2.5.4-pillow13.0.0-${{ hashFiles('repo/source/mm_tools/rocket_rider/build_rocketrider_pk3.py', 'repo/source/mm_tools/rocket_rider/build_v1_classic.py', 'repo/source/mm_tools/rocket_rider/common.py', 'repo/source/mm_tools/gokart_driver.py', 'repo/source/mm_tools/md3lib.py', 'repo/source/mm_tools/id1/player.mdl') }}

      - name: Cache zz_johnbird.pk3
        id: cache_johnbird
        uses: actions/cache@v6
        with:
          path: pk3cache/zz_johnbird.pk3
          key: zz_johnbird-${{ env.BASE_JOHNBIRD_SHA256 }}-numpy2.5.4-pillow13.0.0-${{ hashFiles('repo/source/mm_tools/build_john_bird_pk3.py', 'repo/source/mm_tools/build_john_bird_head.py', 'repo/source/mm_tools/build_john_bird_anim_candidates.py', 'repo/source/mm_tools/md3lib.py', 'repo/source/mm_tools/john_bird_assets/**') }}

      - name: Cache zz_wewcannon.pk3
        id: cache_wewcannon
        uses: actions/cache@v6
        with:
          path: pk3cache/zz_wewcannon.pk3
          key: zz_wewcannon-${{ env.BASE_BAKERSFIELD_SHA256 }}-${{ hashFiles('repo/source/mm_tools/wew_cannon/build_wewcannon_pk3.py', 'repo/source/mm_tools/wew_cannon/assets/**', 'repo/source/mm_tools/md3lib.py') }}

      - name: Cache zz_quakedesk.pk3
        id: cache_quakedesk
        uses: actions/cache@v6
        with:
          path: pk3cache/zz_quakedesk.pk3
          key: zz_quakedesk-${{ hashFiles('repo/source/mm_tools/quake_desk/build_quakedesk_pk3.py', 'repo/source/mm_tools/quake_desk/assets/**') }}

      - name: Cache zz_dn3shotgun.pk3
        id: cache_dn3shotgun
        uses: actions/cache@v6
        with:
          path: pk3cache/zz_dn3shotgun.pk3
          key: zz_dn3shotgun-pillow13.0.0-${{ hashFiles('repo/source/mm_tools/dn3_shotgun/build_dn3shotgun_pk3.py', 'repo/source/mm_tools/dn3_shotgun/assets/**') }}

      - name: Cache zz_foreloco.pk3
        id: cache_foreloco
        uses: actions/cache@v6
        with:
          path: pk3cache/zz_foreloco.pk3
          key: zz_foreloco-numpy2.5.4-pillow13.0.0-${{ hashFiles('repo/source/mm_tools/foreloco/build_foreloco_pk3.py', 'repo/source/mm_tools/foreloco/build_foreloco_sprites.py', 'repo/source/mm_tools/md3lib.py', 'repo/source/mm_tools/foreloco/assets/**') }}

      - name: Cache zz_dn3fx.pk3
        id: cache_dn3fx
        uses: actions/cache@v6
        with:
          path: pk3cache/zz_dn3fx.pk3
          key: zz_dn3fx-numpy2.5.4-pillow13.0.0-${{ hashFiles('repo/source/mm_tools/dn3_fx/build_dn3fx_pk3.py', 'repo/source/mm_tools/dn3_fx/assets/**') }}

      - name: Install pk3 build dependencies
        if: steps.cache_bakovan.outputs.cache-hit != 'true' || steps.cache_karts.outputs.cache-hit != 'true' || steps.cache_minimap.outputs.cache-hit != 'true' || steps.cache_pinklady.outputs.cache-hit != 'true' || steps.cache_kyle.outputs.cache-hit != 'true' || steps.cache_rocketrider.outputs.cache-hit != 'true' || steps.cache_johnbird.outputs.cache-hit != 'true' || steps.cache_dn3shotgun.outputs.cache-hit != 'true' || steps.cache_foreloco.outputs.cache-hit != 'true' || steps.cache_dn3fx.outputs.cache-hit != 'true'
        run: python -m pip install --quiet numpy==2.5.4 pillow==13.0.0   # pinned: a pillow change alters PNG bytes and the pk3 hash

      - name: Build zz_bakovan.pk3
        if: steps.cache_bakovan.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
          python repo/source/mm_tools/van_bako/build_van_bako_pk3.py out/BAKOQUAKE/BakersfieldQuake/bakersfield.pk3 pk3cache/zz_bakovan.pk3

      - name: Build zz_karts.pk3
        if: steps.cache_karts.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
          python -I repo/source/mm_tools/build_gokart_pk3.py out/BAKOQUAKE/BakersfieldQuake/bakersfield.pk3 pk3cache/zz_karts.pk3

      - name: Build zz_gunnomip.pk3
        # The dookie, green-jar and drone view-model shaders with "nomipmaps": about 52 MB less texture memory per map.
        if: steps.cache_gunnomip.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
          python -I repo/source/mm_tools/build_gunnomip_pk3.py out/BAKOQUAKE/BakersfieldQuake/bakersfield.pk3 pk3cache/zz_gunnomip.pk3

      - name: Build zz_minimap.pk3
        if: steps.cache_minimap.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
          preserve=()
          [ -f out/BAKOQUAKE/BakersfieldQuake/zz_minimap.pk3 ] && preserve=(--preserve-from out/BAKOQUAKE/BakersfieldQuake/zz_minimap.pk3)
          python -I repo/source/mm_tools/build_minimap_pk3.py out/BAKOQUAKE/BakersfieldQuake pk3cache/zz_minimap.pk3 "${preserve[@]}"

      - name: Build zz_pinklady.pk3
        # Tone down the over-bright Pink Lady projectile textures for rgbGen identity + Zircon HDR/gamma.
        if: steps.cache_pinklady.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
          python -I repo/source/mm_tools/build_pinklady_pk3.py out/BAKOQUAKE/BakersfieldQuake/bakersfield.pk3 pk3cache/zz_pinklady.pk3

      - name: Build zz_kyle.pk3
        if: steps.cache_kyle.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
          python -I repo/source/mm_tools/kyle_scissors/build_kyle_pk3.py out/BAKOQUAKE/BakersfieldQuake/bakersfield.pk3 pk3cache/zz_kyle.pk3

      - name: Build zz_rocketrider.pk3
        if: steps.cache_rocketrider.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
          python -I repo/source/mm_tools/rocket_rider/build_rocketrider_pk3.py out/BAKOQUAKE/BakersfieldQuake/bakersfield.pk3 pk3cache/zz_rocketrider.pk3

      - name: Build zz_johnbird.pk3
        if: steps.cache_johnbird.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
          python -I repo/source/mm_tools/build_john_bird_pk3.py --base-pk3 out/BAKOQUAKE/BakersfieldQuake/zz_johnbird.pk3 --out-pk3 pk3cache/zz_johnbird.pk3

      - name: Build zz_wewcannon.pk3
        if: steps.cache_wewcannon.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
          python -I repo/source/mm_tools/wew_cannon/build_wewcannon_pk3.py out/BAKOQUAKE/BakersfieldQuake/bakersfield.pk3 pk3cache/zz_wewcannon.pk3

      - name: Build zz_quakedesk.pk3
        if: steps.cache_quakedesk.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
          python -I repo/source/mm_tools/quake_desk/build_quakedesk_pk3.py --out pk3cache/zz_quakedesk.pk3

      - name: Build zz_dn3shotgun.pk3
        if: steps.cache_dn3shotgun.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
          python -I repo/source/mm_tools/dn3_shotgun/build_dn3shotgun_pk3.py --out pk3cache/zz_dn3shotgun.pk3

      - name: Build zz_foreloco.pk3
        if: steps.cache_foreloco.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
          python -I repo/source/mm_tools/foreloco/build_foreloco_pk3.py out/BAKOQUAKE/BakersfieldQuake/bakersfield.pk3 pk3cache/zz_foreloco.pk3

      - name: Build zz_dn3fx.pk3
        if: steps.cache_dn3fx.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
          python -I repo/source/mm_tools/dn3_fx/build_dn3fx_pk3.py --out pk3cache/zz_dn3fx.pk3

      - name: Add overlay pk3s to the package
        run: |
          cp pk3cache/zz_bakovan.pk3 pk3cache/zz_karts.pk3 pk3cache/zz_gunnomip.pk3 pk3cache/zz_minimap.pk3 pk3cache/zz_pinklady.pk3 pk3cache/zz_kyle.pk3 pk3cache/zz_wewcannon.pk3 pk3cache/zz_rocketrider.pk3 pk3cache/zz_johnbird.pk3 pk3cache/zz_quakedesk.pk3 pk3cache/zz_dn3shotgun.pk3 pk3cache/zz_foreloco.pk3 pk3cache/zz_dn3fx.pk3 out/BAKOQUAKE/BakersfieldQuake/
          sha256sum pk3cache/*.pk3

      - name: Cache fteqcc
        id: cache_fteqcc
        uses: actions/cache@v6
        with:
          path: qcccache/fteqcc.bin
          key: fteqcc-linux-x86_64-${{ env.FTEQW_REF }}

      - name: Build fteqcc
        if: steps.cache_fteqcc.outputs.cache-hit != 'true'
        run: |
          pkg-config --exists zlib || (sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev)
          mkdir -p qcccache fteqw
          git init -q fteqw
          git -C fteqw fetch -q --depth 1 https://github.com/fte-team/fteqw "$FTEQW_REF"
          git -C fteqw checkout -q FETCH_HEAD
          make -C fteqw/engine/qclib -j"$(nproc)" qcc
          cp fteqw/engine/qclib/fteqcc.bin qcccache/fteqcc.bin
          chmod +x qcccache/fteqcc.bin
          rm -rf fteqw

      - name: Compile QuakeC (progs.dat, menu.dat, csprogs.dat)
        run: |
          QCC="$PWD/qcccache/fteqcc.bin"
          chmod +x "$QCC"
          rm -rf qc_build && mkdir -p qc_build
          cp -R repo/source/qc_combat_decomp repo/source/menu_qc qc_build/
          compile_qc() {
            local d="$1" out_name="$2" dest="$3"
            rm -f "$d/$out_name"
            (cd "$d" && "$QCC" -srcfile progs.src) >"$d.log" 2>&1 || {
              grep -i error "$d.log" | head -40
              tail -40 "$d.log"
              exit 1
            }
            test -s "$d/$out_name" || { echo "::error::$d produced empty or missing $out_name"; exit 1; }
            cp "$d/$out_name" "$dest"
            echo "compiled $(basename "$dest") ($(wc -c < "$dest") bytes, $(grep -c warning "$d.log" || true) warnings)"
          }
          G=out/BAKOQUAKE/BakersfieldQuake
          compile_qc qc_build/qc_combat_decomp progs.dat "$G/progs.dat"
          compile_qc qc_build/menu_qc menu.dat "$G/menu.dat"
          compile_qc qc_build/qc_combat_decomp/csqc progs.dat "$G/csprogs.dat"
          # Stamp back quake15/csprogs.dat header CRC (as source/mm_tools/assemble_local_package.sh & build_csqc.py do).
          python -I - out/BAKOQUAKE/quake15/csprogs.dat "$G/csprogs.dat" <<'PY'
          import struct, sys
          crc = struct.unpack_from("<i", open(sys.argv[1], "rb").read(), 4)[0]
          d = bytearray(open(sys.argv[2], "rb").read())
          struct.pack_into("<i", d, 4, crc)
          open(sys.argv[2], "wb").write(d)
          print(f"csprogs.dat header CRC set to {crc}")
          PY
          sha256sum "$G/progs.dat" "$G/menu.dat" "$G/csprogs.dat"
          rm -rf qc_build

      - name: Check the package
        # Fails the run before anything is zipped or published when the package could not start a game or a server.
        run: |
          python -I - out/BAKOQUAKE <<'EOF'
          import os, re, struct, sys, zipfile

          root = sys.argv[1]
          errors = []

          for rel in ("BakersfieldQuake/progs.dat", "BakersfieldQuake/menu.dat", "BakersfieldQuake/csprogs.dat",
                      "BakersfieldQuake/ultralow.cfg", "BakersfieldQuake/safemode.cfg",
                      "engine/zircon_beta_gcc.exe", "Update.exe", "Update.sh", "Report a Problem.cmd", "Display Settings.cmd",
                      "tools/find-quake-paks.ps1", "tools/find-quake-paks.sh",
                      "tools/bq-preflight.ps1", "tools/bq-report.ps1",
                      "tools/bq_update.py", "tools/bq_display.py", "tools/install-shortcuts.ps1",
                      "tools/install-shortcuts.sh", "tools/bakoquake.ico", "tools/bakoquake-256.png",
                      "tools/bakoquake-update.ico", "tools/bakoquake-update-256.png"):
              p = os.path.join(root, rel)
              if not os.path.isfile(p) or os.path.getsize(p) == 0:
                  errors.append(f"missing or empty {rel}")
          progs_path = os.path.join(root, "BakersfieldQuake", "progs.dat")
          if os.path.isfile(progs_path):
              progs_raw = open(progs_path, "rb").read()
              for marker in (b"misc_vehicle_rocketrider", b"progs/rocket_rider.md3", b"progs/rocket_rider_rider.md3"):
                  if marker not in progs_raw:
                      errors.append(f"BakersfieldQuake/progs.dat missing expected symbol/string {marker.decode('ascii')}")
          for rel in ("id1/pak0.pak", "id1/pak1.pak"):
              if os.path.exists(os.path.join(root, rel)):
                  errors.append(f"{rel} is id Software's paid Quake data and must not ship (the launchers find the player's own)")

          # Every map the package holds: loose maps/*.bsp and maps/ inside the pk3s/paks of each game dir.
          maps = set()
          for game in ("id1", "quake15", "BakersfieldQuake"):
              gdir = os.path.join(root, game)
              if not os.path.isdir(gdir):
                  continue
              if os.path.isdir(os.path.join(gdir, "maps")):
                  maps.update(f.lower() for f in os.listdir(os.path.join(gdir, "maps")))
              for f in os.listdir(gdir):
                  path = os.path.join(gdir, f)
                  if f.lower().endswith(".pk3"):
                      with zipfile.ZipFile(path) as z:
                          maps.update(n[5:].lower() for n in z.namelist() if n.lower().startswith("maps/"))
                  elif f.lower().endswith(".pak"):
                      with open(path, "rb") as fh:
                          magic, off, size = struct.unpack("<4sii", fh.read(12))
                          if magic == b"PACK":
                              fh.seek(off)
                              for _ in range(size // 64):
                                  name = fh.read(64)[:56].split(b"\0")[0].decode("latin-1").lower()
                                  if name.startswith("maps/"):
                                      maps.add(name[5:])

          # server.cfg: the first map (map X) and every map in the bm_maplist rotation.
          cfg = os.path.join(root, "BakersfieldQuake", "server.cfg")
          wanted = []
          if os.path.isfile(cfg):
              for line in open(cfg, encoding="latin-1"):
                  line = line.split("//", 1)[0].strip()
                  m = re.match(r'(?:seta?\s+)?bm_maplist\s+(?:"([^"]*)"|(\S+))', line)
                  if m:
                      wanted += (m.group(1) if m.group(1) is not None else m.group(2)).split()
                  m = re.match(r'(?:map|changelevel)\s+"?([^\s";]+)', line)
                  if m:
                      wanted.append(m.group(1))
          else:
              errors.append("missing BakersfieldQuake/server.cfg")
          for name in dict.fromkeys(wanted):
              if name.lower() + ".bsp" not in maps:
                  errors.append(f"server.cfg names map '{name}' but maps/{name}.bsp is not in the package")

          # quake.rc's key/setting migrations: every exec'd bm_up_N.cfg must ship.
          rc = os.path.join(root, "BakersfieldQuake", "quake.rc")
          if os.path.isfile(rc):
              code = re.sub(r"//[^\n]*", "", open(rc, encoding="latin-1").read())   # the how-to comment names the next bm_up file
              for n in sorted(set(re.findall(r"exec\s+(bm_up_\w+\.cfg)", code))):
                  if not os.path.isfile(os.path.join(root, "BakersfieldQuake", n)):
                      errors.append(f"quake.rc execs {n} but it is not in the package")

          # zz_gunnomip.pk3 replaces three whole shader files of bakersfield.pk3: each must be there, with every shader
          # block still carrying nomipmaps. zz_gunframes.pk3 (the atlas pack) replaces the same files and would lose.
          gunnomip = os.path.join(root, "BakersfieldQuake", "zz_gunnomip.pk3")
          if not os.path.isfile(gunnomip):
              errors.append("missing BakersfieldQuake/zz_gunnomip.pk3")
          else:
              with zipfile.ZipFile(gunnomip) as z:
                  for n in ("scripts/dookievm.shader", "scripts/greenjarvm.shader", "scripts/rh_dronevm.shader"):
                      if n not in z.namelist():
                          errors.append(f"zz_gunnomip.pk3 lacks {n}")
                          continue
                      text = z.read(n).decode("latin-1")
                      blocks, nomip = len(re.findall(r"^\{$", text, re.M)), text.count("\tnomipmaps\n")
                      if not blocks or nomip != blocks:
                          errors.append(f"zz_gunnomip.pk3 {n}: {nomip} of {blocks} shaders have nomipmaps")
          if os.path.exists(os.path.join(root, "BakersfieldQuake", "zz_gunframes.pk3")):
              errors.append("zz_gunframes.pk3 and zz_gunnomip.pk3 replace the same shader files: ship only one")

          if not os.path.isfile(os.path.join(root, "BakersfieldQuake", "zz_minimap.pk3")):
              errors.append("missing BakersfieldQuake/zz_minimap.pk3")

          pinklady = os.path.join(root, "BakersfieldQuake", "zz_pinklady.pk3")
          if not os.path.isfile(pinklady):
              errors.append("missing BakersfieldQuake/zz_pinklady.pk3")
          else:
              with zipfile.ZipFile(pinklady) as z:
                  pngs = [n for n in z.namelist() if n.startswith("progs/pinklady_") and n.endswith(".png")]
                  if len(pngs) != 138:
                      errors.append(f"zz_pinklady.pk3: expected 138 frame PNGs, found {len(pngs)}")

          kyle = os.path.join(root, "BakersfieldQuake", "zz_kyle.pk3")
          if not os.path.isfile(kyle):
              errors.append("missing BakersfieldQuake/zz_kyle.pk3")
          else:
              with zipfile.ZipFile(kyle) as z:
                  names = set(z.namelist())
                  for req in ("progs/v_kyle.md3", "progs/kyle_proj.spr32", "progs/kyle_torpedo.md3", "progs/kyle_scissors.md3", "scripts/kylevm.shader"):
                      if req not in names:
                          errors.append(f"zz_kyle.pk3 lacks {req}")

          rocketrider = os.path.join(root, "BakersfieldQuake", "zz_rocketrider.pk3")
          if not os.path.isfile(rocketrider):
              errors.append("missing BakersfieldQuake/zz_rocketrider.pk3")
          else:
              with zipfile.ZipFile(rocketrider) as z:
                  rnames = set(z.namelist())
                  for req in (
                      "progs/rocket_rider.md3",
                      "progs/rocket_rider.md3_0.skin",
                      "progs/rocket_rider_rider.md3",
                      "progs/rocket_rider_rider.md3_0.skin",
                      "progs/rr_ranger_skin.png",
                      "progs/rr_v1_flame.png",
                      "progs/rr_v1_rocket.png",
                      "progs/rr_v1_rocket_glow.png",
                      "scripts/rocket_rider.shader",
                  ):
                      if req not in rnames:
                          errors.append(f"zz_rocketrider.pk3 lacks {req}")

          johnbird = os.path.join(root, "BakersfieldQuake", "zz_johnbird.pk3")
          if not os.path.isfile(johnbird):
              errors.append("missing BakersfieldQuake/zz_johnbird.pk3")
          else:
              with zipfile.ZipFile(johnbird) as z:
                  if "progs/john_bird_head.md3" not in z.namelist():
                      errors.append("zz_johnbird.pk3 lacks progs/john_bird_head.md3")
                  else:
                      hdr = z.read("progs/john_bird_head.md3")[:108]
                      ident, ver, _, _, nf = struct.unpack("<4si64s2i", hdr[:80])
                      if ident != b"IDP3" or ver != 15 or nf != 164:
                          errors.append(f"zz_johnbird.pk3 progs/john_bird_head.md3 expected 164 frames, got ident={ident} ver={ver} nf={nf}")

          wewcannon = os.path.join(root, "BakersfieldQuake", "zz_wewcannon.pk3")
          if not os.path.isfile(wewcannon):
              errors.append("missing BakersfieldQuake/zz_wewcannon.pk3")
          else:
              with zipfile.ZipFile(wewcannon) as z:
                  wnames = set(z.namelist())
                  for req in ("progs/v_wewcannon.md3", "sound/wcannon/wc_charge.wav", "sound/wcannon/wc_shoot.wav", "sound/wcannon/wc_scream.wav", "sound/wcannon/wc_lrun01.wav"):
                      if req not in wnames:
                          errors.append(f"zz_wewcannon.pk3 lacks {req}")

          quakedesk = os.path.join(root, "BakersfieldQuake", "zz_quakedesk.pk3")
          if not os.path.isfile(quakedesk):
              errors.append("missing BakersfieldQuake/zz_quakedesk.pk3")
          else:
              with zipfile.ZipFile(quakedesk) as z:
                  qnames = set(z.namelist())
                  for req in (
                      "progs/qdesk_b.md3",
                      "progs/qdesk_b.md3_0.skin",
                      "progs/qdesk_b.md3_1.skin",
                      "progs/qdesk_b.md3_2.skin",
                      "progs/qdb_crt_screen.png",
                      "progs/qdb_crt_screen_a.png",
                      "progs/qdb_crt_screen_c.png",
                      "progs/qdb_leds.png",
                      "scripts/qdesk_b.shader",
                  ):
                      if req not in qnames:
                          errors.append(f"zz_quakedesk.pk3 lacks {req}")

          bd_bsp = os.path.join(root, "BakersfieldQuake", "maps", "bakersfielddowntown.bsp")
          if os.path.isfile(bd_bsp):
              with open(bd_bsp, "rb") as fh:
                  hdr = fh.read(12)
                  l0_ofs, l0_len = struct.unpack_from("<2i", hdr, 4)
                  fh.seek(l0_ofs)
                  l0_txt = fh.read(l0_len).rstrip(b"\x00").decode("latin-1")
              n_qdesk = l0_txt.count('"mdl" "progs/qdesk_b.md3"')
              if n_qdesk != 18:
                  errors.append(f"bakersfielddowntown.bsp expected 18 progs/qdesk_b.md3 LAN desks, found {n_qdesk}")
              n_qdesk_cls = l0_txt.count('"classname" "misc_lan_quakedesk"')
              if n_qdesk_cls != 18:
                  errors.append(f"bakersfielddowntown.bsp expected 18 misc_lan_quakedesk LAN desks, found {n_qdesk_cls}")
              if l0_txt.count('"classname" "item_powerup_foreloco"') < 1:
                  errors.append("bakersfielddowntown.bsp missing item_powerup_foreloco spawns")

          foreloco = os.path.join(root, "BakersfieldQuake", "zz_foreloco.pk3")
          if not os.path.isfile(foreloco):
              errors.append("missing BakersfieldQuake/zz_foreloco.pk3")
          else:
              with zipfile.ZipFile(foreloco) as z:
                  fnames = set(z.namelist())
                  for req in (
                      "progs/foreloco_can.md3",
                      "progs/v_foreloco.md3",
                      "progs/foreloco_proj_can.md3",
                      "progs/foreloco_bedpan.md3",
                      "gfx/foreloco/vm_01.png",
                      "gfx/foreloco/vm_10.png",
                      "gfx/foreloco/vm_16.png",
                      "gfx/foreloco/vm_36.png",
                      "gfx/foreloco/pour_stream.png",
                      "gfx/foreloco/smear_pink.png",
                      "gfx/foreloco/smear_green.png",
                      "gfx/foreloco/smear_drips.png",
                      "scripts/foreloco.shader",
                      "sound/foreloco/party_loop.wav",
                      "sound/foreloco/vegas_baby.wav",
                  ):
                      if req not in fnames:
                          errors.append(f"zz_foreloco.pk3 lacks {req}")

          dn3fx = os.path.join(root, "BakersfieldQuake", "zz_dn3fx.pk3")
          if not os.path.isfile(dn3fx):
              errors.append("missing BakersfieldQuake/zz_dn3fx.pk3")
          else:
              with zipfile.ZipFile(dn3fx) as z:
                  dnames = set(z.namelist())
                  for req in (
                      "progs/dn3fx_bloodpuff.spr32",
                      "progs/dn3fx_explode.spr32",
                      "progs/dn3fx_wallsplat.md3",
                      "progs/dn3fx_pool.md3",
                      "progs/dn3fx_flesh1.md3",
                      "scripts/dn3fx.shader",
                      "sound/dn3fx/bombexpl.wav",
                  ):
                      if req not in dnames:
                          errors.append(f"zz_dn3fx.pk3 lacks {req}")

          print(f"{len(maps)} map files in the package; server.cfg wants: {' '.join(dict.fromkeys(wanted))}")
          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          EOF

      - name: Release tag
        run: |
          tag="${NEW_TAG:-v1.${GITHUB_RUN_NUMBER}}"
          [ "$DRAFT" = true ] && tag="${tag}-draft"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Release tag: $tag"
          # Shown in game, bottom right (quake.rc: showdate + exec version.cfg), so a player can see an update landed.
          # Kept short (v1.<run>): it is right-aligned and a longer string runs over the status bar.
          printf '// Written by build-zip.yml: the release this game data comes from.\nset showdate_format "%s"\n' "${tag#build-}" \
              > out/BAKOQUAKE/BakersfieldQuake/version.cfg
          cat out/BAKOQUAKE/BakersfieldQuake/version.cfg

      - name: Zip the Windows package (master)
        # pk3/pak/png are already compressed: store them instead of deflating 1 GB again.
        # This is the asset source for the next run, so its name and tree stay exactly as before.
        run: |
          cd out
          zip -q -r -n .pk3:.pak:.png:.jpg:.ogg ../BAKOQUAKE.zip BAKOQUAKE
          cd ..
          ls -l BAKOQUAKE.zip

      - name: Base pk3 guard
        # Players download only changed files; the base pk3s are ~920 MB. Warn (not fail) if either differs
        # from the latest published release. Content belongs in zz_<feature>.pk3 overlays (AGENTS.md).
        run: |
          python repo/source/ci/base_pk3_guard.py "$GITHUB_REPOSITORY" BAKOQUAKE.zip \
            BAKOQUAKE/BakersfieldQuake/bakersfield.pk3 BAKOQUAKE/quake15/q15.pk3

      - name: Zip the Linux and macOS packages
        # Derive each from the master zip (no second 1 GB tree on disk, no recompressing assets):
        # strip the Windows-only entries, then add that OS's root darkplaces-sdl/-dedicated binaries.
        # Both platforms use the same root names, so they must be separate zips.
        run: |
          make_os_zip() {
            local out_zip="$1" sdl="$2" ded="$3"
            cp BAKOQUAKE.zip "$out_zip"
            # Remove the Windows engine/ tree recursively (including engine/bin64/*.dll), then use -ws
            # (wildcards stop at '/') so only root-level Windows files and tools/bq-update.exe go.
            zip -q -d "$out_zip" 'BAKOQUAKE/engine/*' 'BAKOQUAKE/engine/' || true
            zip -q -d -ws "$out_zip" \
              'BAKOQUAKE/*.exe' 'BAKOQUAKE/*.dll' 'BAKOQUAKE/*.cmd' 'BAKOQUAKE/*.bat' 'BAKOQUAKE/tools/bq-update.exe' || true
            rm -rf stage && mkdir -p stage/BAKOQUAKE
            cp "eng/$sdl" stage/BAKOQUAKE/darkplaces-sdl
            cp "eng/$ded" stage/BAKOQUAKE/darkplaces-dedicated
            chmod +x stage/BAKOQUAKE/darkplaces-sdl stage/BAKOQUAKE/darkplaces-dedicated
            (cd stage && zip -q -g -X "../$out_zip" BAKOQUAKE/darkplaces-sdl BAKOQUAKE/darkplaces-dedicated)
            ls -l "$out_zip"
          }
          make_os_zip BAKOQUAKE-linux-x86_64.zip  zircon_beta_linux_sdl       zircon_beta_linux_dedicated_server
          make_os_zip BAKOQUAKE-macos-arm64.zip   zircon_beta_macos_arm64_sdl zircon_beta_macos_arm64_dedicated_server

      # The signed app bundle holds the engine (pinned by ZIRCON_REF in build_app.sh), the launcher, the frozen updater
      # and the icon; game data reaches it through its own updater (manifest-macos-app.json). So a new DMG is only
      # built when one of those bundle inputs changed since the newest release that has a DMG. Every release records
      # the hash of those inputs in a hidden <!-- mac-inputs: ... --> note; a missing note counts as changed.
      - name: Decide whether the macOS app needs a new DMG
        id: mac
        run: |
          inputs=$(cd repo && git ls-files -z source/mac tools/bq_update.py tools/bq_display.py source/icons/bakoquake-256.png source/icons/bakoquake-update-256.png | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "MAC_INPUTS=$inputs" >> "$GITHUB_ENV"
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
          build=true why="started by hand"
          prev_tag=""
          prev_mac_inputs=""
          for t in $(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts -L 20 --json tagName -q '.[].tagName'); do
            gh release view "$t" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx BAKOQUAKE-macos-arm64.dmg || continue
            prev_tag="$t"
            prev_mac_inputs=$(gh release view "$t" -R "$GITHUB_REPOSITORY" --json body -q .body | sed -n 's/.*<!-- mac-inputs: \(.*\) -->.*/\1/p' | head -1)
            break
          done
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            if [ -n "$prev_mac_inputs" ] && [ "$prev_mac_inputs" = "$inputs" ]; then
              build=false why="app inputs unchanged since the newest release with a DMG"
            else
              old=${prev_mac_inputs:0:12}; why="app inputs ${inputs:0:12}, the newest DMG has ${old:-none recorded}"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "PREV_DMG_TAG=$prev_tag" >> "$GITHUB_ENV"
          echo "PREV_MAC_INPUTS=$prev_mac_inputs" >> "$GITHUB_ENV"
          echo "macOS app build: $build ($why)"

      - name: Write updater manifests
        # One per platform zip: every file's size and sha256, plus the tag-specific zip URL and VPS fallback base.
        # Players' updaters fetch releases/latest/download/manifest-<platform>.json (falling back to the VPS) and pull
        # changed/missing files via Range requests or VPS sha256 blobs. build = run number (never rolls back).
        run: |
          notes=$(cd repo && git log -n 5 --no-merges --pretty=format:"• %s" | head -c 320)
          vps="https://bakersfield.larrywew.fun/updates"
          dl="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          for pair in BAKOQUAKE.zip:windows-x64 BAKOQUAKE-linux-x86_64.zip:linux-x86_64 BAKOQUAKE-macos-arm64.zip:macos-arm64; do
            z="${pair%%:*}" plat="${pair##*:}"
            python -I repo/source/ci/make_manifest.py "$z" "$dl/$z" "$GITHUB_RUN_NUMBER" "$TAG" \
              --notes "$notes" --vps-base "$vps" > "manifest-$plat.json"
            python -c "import json,sys; m=json.load(open(sys.argv[1])); print(sys.argv[1], len(m['files']), 'files')" "manifest-$plat.json"
          done
          # Carry forward the latest published DMG metadata into manifest-macos-app.json so Mac users are not blocked
          # while a new DMG builds/notarizes; the macos job patches this manifest once notarization finishes.
          dmg_args=()
          if [ -n "${PREV_DMG_TAG:-}" ]; then
            rm -f prev_mac_manifest.json
            if gh release download "$PREV_DMG_TAG" -R "$GITHUB_REPOSITORY" -p manifest-macos-app.json -O prev_mac_manifest.json >/dev/null 2>&1; then
              readarray -t prev_meta < <(python -c 'import json; m=json.load(open("prev_mac_manifest.json", encoding="utf-8")); print("\n".join(str(m.get(k, "") or "") for k in ("mac_inputs", "dmg_url", "dmg_vps_url", "dmg_size", "dmg_sha256")))')
              [ -n "${prev_meta[0]}" ] && dmg_args+=(--mac-inputs "${prev_meta[0]}")
              [ -n "${prev_meta[1]}" ] && dmg_args+=(--dmg-url "${prev_meta[1]}")
              [ -n "${prev_meta[2]}" ] && dmg_args+=(--dmg-vps-url "${prev_meta[2]}")
              [ -n "${prev_meta[3]}" ] && dmg_args+=(--dmg-size "${prev_meta[3]}")
              [ -n "${prev_meta[4]}" ] && dmg_args+=(--dmg-sha256 "${prev_meta[4]}")
            fi
          fi
          z=BAKOQUAKE-macos-arm64.zip
          python -I repo/source/ci/make_manifest.py "$z" "$dl/$z" "$GITHUB_RUN_NUMBER" "$TAG" \
            --only BakersfieldQuake/ --only quake15/ --only tools/ \
            --notes "$notes" --vps-base "$vps" "${dmg_args[@]}" > manifest-macos-app.json
          python -c "import json,sys; m=json.load(open(sys.argv[1])); print(sys.argv[1], len(m['files']), 'files')" manifest-macos-app.json

      - name: Publish release
        id: publish
        env:
          MAC_BUILD: ${{ steps.mac.outputs.build }}
        run: |
          tag="$TAG"
          if [ "$MAC_BUILD" = true ]; then
            dmgnote="The DMG is added a few minutes after the other files, once notarization finishes. <!-- dmg: expected -->"
          else
            dmgnote="No new DMG in this release (the app bundle inputs did not change): use the DMG from an earlier release, the app updates its game data on launch."
          fi
          assets=(BAKOQUAKE.zip BAKOQUAKE-linux-x86_64.zip BAKOQUAKE-macos-arm64.zip manifest-windows-x64.json manifest-linux-x86_64.json manifest-macos-arm64.json manifest-macos-app.json)
          flags=(--latest)
          [ "$DRAFT" = true ] && flags=(--draft)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release create "$tag" "${assets[@]}" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${flags[@]}" \
            --title "$tag" \
            --notes "Playable packages, built by the Build release packages workflow from ${BASE} + repo ${GITHUB_SHA::7} (progs.dat, menu.dat, csprogs.dat, configs, zz_bakovan.pk3, zz_karts.pk3, zz_gunnomip.pk3, zz_minimap.pk3, zz_pinklady.pk3, zz_kyle.pk3, zz_wewcannon.pk3, zz_rocketrider.pk3, zz_johnbird.pk3, zz_quakedesk.pk3, bakersfielddowntown.bsp, bakersfielddowntown_lite.bsp). Windows/Linux/macOS engine from ${ENGINE_REPO}@${ENGINE}. <!-- mac-inputs: ${MAC_INPUTS} -->

          Already installed? Play and Start Server (Windows, Linux) and the macOS app verify all game assets on launch and prompt to update whenever files changed or are missing (GitHub with VPS fallback).

          You need your own copy of Quake (Steam or GOG). On first run the launcher finds its pak0.pak/pak1.pak and copies them into id1; if it can't, copy them there yourself.

          - **Windows** - BAKOQUAKE.zip - unzip, run PLAY BAKERSFIELDQUAKE.exe (or Update.exe to check/repair)
          - **Linux** - BAKOQUAKE-linux-x86_64.zip - needs system SDL2 (e.g. sudo apt install libsdl2-2.0-0); run ./Play.sh (or ./Update.sh)
          - **macOS (Apple Silicon)** - BAKOQUAKE-macos-arm64.dmg - open it, drag BAKOQUAKE and Update BAKOQUAKE to Applications (macOS 13+). ${dmgnote}"

      - name: Sync fallback files to VPS
        if: inputs.draft != true
        env:
          VPS_SYNC_HOST: ${{ secrets.VPS_SYNC_HOST }}
          VPS_SYNC_USER: ${{ secrets.VPS_SYNC_USER }}
          VPS_SYNC_KEY: ${{ secrets.VPS_SYNC_KEY }}
          VPS_SYNC_PORT: ${{ secrets.VPS_SYNC_PORT }}
          VPS_SYNC_DIR: ${{ secrets.VPS_SYNC_DIR }}
        run: |
          python -I repo/source/ci/sync_vps.py \
            --manifests manifest-windows-x64.json manifest-linux-x86_64.json manifest-macos-arm64.json manifest-macos-app.json \
            --zips BAKOQUAKE.zip BAKOQUAKE-linux-x86_64.zip BAKOQUAKE-macos-arm64.zip

  # Signed, notarized BAKOQUAKE.app in a DMG, built from the macOS zip just published. The engine and every dylib
  # it loads are built from pinned sources (see source/mac/build_app.sh). Runs on the self-hosted Mac ozzy-2, a
  # persistent machine: Xcode is asserted below, cmake is pinned through pip, and the signing keychain is removed
  # after every run.
  macos:
    needs: build
    if: needs.build.outputs.mac == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      XCODE_VERSION: "26.3"   # bump together with Xcode on ozzy-2; the deps cache key includes it
      WORK: ${{ github.workspace }}/.bq-mac   # inside the workspace: actions/cache rejects ".." paths
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # ozzy-2 is a persistent machine: fail loudly if Xcode was updated under us, and take cmake (a build tool,
      # nothing of it ends up in the bundle) from a pinned wheel instead of whatever is installed there.
      # Python comes from uv (python-build-standalone, built for macOS 11.0), not actions/setup-python, which
      # hard-codes /Users/runner/hostedtoolcache on macOS. It freezes tools/bq_update.py into the app, and
      # build_app.sh checks its libraries target macOS 13.0 like everything else in the bundle.
      - name: Check toolchain
        run: |
          v=$(xcodebuild -version | awk 'NR==1 {print $2}')
          [ "$v" = "$XCODE_VERSION" ] || { echo "::error::Xcode is $v, the workflow pins $XCODE_VERSION"; exit 1; }
          uv python install 3.12
          echo "PYTHON=$(uv python find --managed-python 3.12)" >> "$GITHUB_ENV"
          uv venv -q --python 3.12 --managed-python "$RUNNER_TEMP/tools"
          uv pip install -q --python "$RUNNER_TEMP/tools/bin/python" cmake==3.31.6
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tools/bin/cmake" --version | head -1
          gh --version | head -1

      - name: Cache source-built dylibs
        # Keyed on the script, which holds every pinned version.
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.bq-mac/prefix-13.0
          key: bq-mac-deps-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('source/mac/build_app.sh') }}

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user | xargs security list-keychains -d user -s "$kc"
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$kc"

      - name: Build, sign, notarize, upload DMG
        env:
          MAC_INPUTS: ${{ needs.build.outputs.mac_inputs }}
        run: UPLOAD=1 source/mac/build_app.sh "${{ needs.build.outputs.tag }}"

      - name: Sync macOS DMG and manifest to VPS
        if: needs.build.outputs.draft != 'true'
        env:
          VPS_SYNC_HOST: ${{ secrets.VPS_SYNC_HOST }}
          VPS_SYNC_USER: ${{ secrets.VPS_SYNC_USER }}
          VPS_SYNC_KEY: ${{ secrets.VPS_SYNC_KEY }}
          VPS_SYNC_PORT: ${{ secrets.VPS_SYNC_PORT }}
          VPS_SYNC_DIR: ${{ secrets.VPS_SYNC_DIR }}
        run: |
          if [ -f "$WORK/out/manifest-macos-app.json" ] && [ -f "$WORK/out/BAKOQUAKE-macos-arm64.dmg" ]; then
            "$PYTHON" -I source/ci/sync_vps.py \
              --dmg "$WORK/out/BAKOQUAKE-macos-arm64.dmg" \
              --manifest "$WORK/out/manifest-macos-app.json"
          fi

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
