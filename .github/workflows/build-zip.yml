          key: ${{ steps.cache_jumppads.outputs.cache-primary-key }}

      - name: Build zz_m4.pk3
        # The silenced M4: the base models plus a silencer surface, and suppressed shot sounds.
        if: steps.cache_m4.outputs.cache-hit != 'true'
        run: |
          mkdir -p pk3cache
          python -I repo/source/mm_tools/build_m4_pk3.py out/BAKOQUAKE/BakersfieldQuake/bakersfield.pk3 pk3cache/zz_m4.pk3 --verify-repro

      - name: Save zz_m4.pk3 cache
        if: steps.cache_m4.outputs.cache-hit != 'true'
