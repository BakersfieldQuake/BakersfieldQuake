// BakersfieldQuake (Bakersfield LAN) default.cfg - what a brand new player gets.
// Runs before config.cfg, so anything a player changes in game is saved and wins next time.
// Part 1 is Combat+'s own default.cfg (mod cvars and aliases) with a few multiplayer changes
// (no chain lightning, no slow motion on deaths, no grappling hook, no quickload).

//New cvars

seta weapon_chain_thunderbolt "0" "Turns the LG into a superweapon, with child bolts attacking enemies in a radius"
seta chainsaw_dm_spawn  "0" "Players spawn with Chainsaws in DM, useful for maps that don't have the chainsaw on them"
seta chainsaw_replaces_ring "0" "Chainsaw replaces ring of shadows in deathmatch - useful for old or existing maps" 
seta chainsaw_drops "0" "Chainsaw will randomly drop from gibbed ogres"
seta deathmatch_music "1" "randomized music player: plays Q3 tracks in deathmatch mode"
seta z_coopconfig "1" "server param to check the loaded config, recommended you do not change"
seta redarmor_backpack "1" "when enabled, there's a 20% chance for a backpack with proximity grenades and ammo to spawn instead of red armor. Can also give you more than max ammo if you have enough."
seta effects_sparkballs "1" "enables sparkballs from explosions like Quake Champions or FEAR - not recommended for coop play"
seta effects_classic_explosion "0" "enables classic software quake inspired particle effects for rocket/grenade explosions"
seta effects_explosion_shake "1" "enables HL1/Duke 3D style screen shakes on explosions"
seta enforcer_defender "1" "makes the green enforcer variant into a defender a la Quoth/AD - shotgun and rapid fire laser"
seta enforcer_defender_prox "0" "gives the defender a chance to launch a proximity mine, slightly closer to his behavior in Quoth/AD mods"
seta shalrath_mother "1"	"gives a small chance for the vore to have the ability to spawn vorelings"
seta teleport_everything "0" "allow projectiles to pass through teleports in SP, OFF by default, ^1BREAKS SPAWNERS IN SP MAPS"
seta teleport_everything_dm "1" "allow projectiles to pass through teleports in deathmatch, ON by default"
seta slowmotion_randomness_player "0" "slowmo chance during player death"
seta soldier_nailgrunt "1" "Grunts with glowing eye model uses a nailgun instead of a shotgun"
seta slowmo_powerup "0" "replace powerup with slowmo rune, 1 = ring of shadows, 2 = quad, 3 = biosuit, 4 = pent "
seta centered_weapons "0" "Replace default models with centered versions"
seta qc_ssg "1" "Replace the old DMC/Q2-inspired SSG with a remake of the Quake Champions SSG"
seta bright_skins "1" "player models are fullbright (ezQuake style), easier to spot; 0 = lit by the map"
seta bm_hud_style "0" "HUD layout style: 0=Classic, 1=Island, 2=Route 99, 3=Cyberpop, 4=Zen Zero"
seta bm_ui_font "1" "UI and HUD font: 1=Roboto (clean), 0=Classic Quake"
seta bm_show_launcher "0" "Reopen pre-launch Display & Graphics Setup on next start (0=no, 1=yes)"
seta bm_minimap "1" "CoD-style anti-wallhack bottom-left minimap (0=off, 1=on)"
seta bm_minimap_range "1400" "Minimap half-window radius in Quake units (600-4000)"
seta bm_minimap_size "39" "Minimap circle radius in virtual 640x360 units (20-72)"
seta bm_minimap_x "8" "Minimap left edge margin in virtual units"
seta bm_minimap_y "8" "Minimap bottom edge margin in virtual units"
seta bm_minimap_alpha "0.62" "Minimap overall opacity (0.10-1.0)"
seta bm_minimap_bg_alpha "0.42" "Minimap dark circular backdrop opacity (0.0-1.0)"
seta bm_minimap_rotate "1" "1=CoD rotating (UP=facing), 0=North-up fixed"
seta bm_minimap_compass "1" "1=show rotating N/E/S/W compass ticks, 0=hide"
seta bm_minimap_fov "0.07" "Forward view cone opacity (0.0-0.5)"

//New Cheats
seta cheat_crazyexplosives 0 "new cheat, insane fire rate for rockets and grenades. Performance killer"
seta cheat_hook_sp "0" "new cheat to enable the swinging grappling hook in single player"

//CTF convars
seta mp_grapple "0" "enable swinging grappling hook in multiplay - 1 - swinging only (skill based) - 2 - classic reeling + swing"
seta ctf "0" "enable CTF gametype on maps that support it"
seta ctf_autobalance "1" "autobalance teams in CTF mode (recommended)"
seta ctf_capture_limit "4" "Amount of captures required to win"

//general server
seta bot_count "0" "amount of bots to spawn in MP"


seta lowspec "0" "low settings for older computers (MENU CONTROLLED)"

//Coop
seta coop_life_pool "0" "coop gamemode where each player has a limited pool of lives (default 3), upon all players running out the level restarts" 
seta coop_lives "3" "How many lives players have in coop with the lives sytem"
seta coop_revive "1" "When lives are enabled, respawn where you died (hazards are excluded and revert to standard spawns)"

seta r_wateralpha "0.4"

//keybind aliases
alias chasecam "impulse 206"
alias throwgrenade "impulse 215" ":Offhand throw proximity grenade"
alias addbot "impulse 100" ":add bot to server - if teamplay enabled will be on your team"
alias removebot "impulse 102" ":remove bot from server"
alias addbotenemy "impulse 101" ":add bot on enemy team"
alias togglekeybinds "wait 5" ":open keybinds menu"
alias change_team "impulse 13" ": swap teams in CTF"
alias reload "impulse 41"
alias reloadm4 "impulse 41"

cl_decals "1"
cl_decals_max "256"
cl_decals_time "16"
cl_decals_fadetime "4"
cl_decals_models "0"
cl_stainmaps "0"

r_coronas "0.6"

// ======================================================================= part 2: modern defaults

// ---- keys: clean WASD layout, nothing single-player (no save/load/quickload/pause/quit keys)
// (the default keys are in bm_binds.cfg: applied once on first launch, see quake.rc)
alias vote "cmd vote $*"		// map votes (bm_match.qc): "vote map fox" in chat, then "vote yes" / "vote no"
alias tank_variant "cmd tank_variant $*"	// Mega Man Tank live prototype switch (1..4)
alias tank_sound "cmd tank_sound $*"		// Mega Man Tank live sound pack switch (0=Official Voted Mix, 1..11)
alias tank_boom_pool "cmd tank_boom_pool $*"	// Mega Man Tank random explosion pool bitmask (default 1793=pack1,9,10,11; 0=active pack; 2047=all 11)

// ---- mouse and movement
freelook 1
lookspring 0
m_filter 0				// raw mouse; smoothing only adds lag
m_pitch 0.022			// not inverted
m_yaw 0.022
sensitivity 3
cl_forwardspeed 999		// always run
cl_backspeed 999
cl_sidespeed 999
cl_upspeed 999

// ---- view
fov 100					// Zircon/DP fov is measured on a 4:3 screen; 100 is about 115 degrees on 16:9
cl_bob 0
cl_rollangle 0
crosshair 5
v_kicktime 0.3

// ---- video: borderless fullscreen out of the box + synced fullscreen/window dims (Alt+Enter never snaps to 4:3)
vid_fullscreen 1
vid_desktopfullscreen 1
vid_borderless 0
vid_width 1920
vid_height 1080
_vid_fullscreen_width 1920
_vid_fullscreen_height 1080
_vid_window_width 1920
_vid_window_height 1080
vid_conwidth 640
vid_conheight 360
vid_vsync 0
vid_samples 4
cl_maxfps 250
cl_maxidlefps 20
gl_picmip 0
gl_picmip_world 0
gl_picmip_other 0
gl_picmip_sprites 0
gl_picmip_force 0
gl_max_size 2048
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
gl_texture_anisotropy 16
gl_texturecompression 0
mod_bsp_portalize 0
developer 0
r_dynamic 1
r_shadow_realtime_dlight 1
r_shadow_realtime_dlight_shadows 1
r_shadow_shadowmapping_texturesize 4096	// shadow atlas for those lights: the engine default 8192 is one 256 MB texture (4096 = 64 MB, same look)
r_shadow_realtime_world 0
r_shadow_gloss 1
r_shadow_usenormalmap 1
r_load_normalmap 1
r_load_gloss 1
r_glsl_offsetmapping 1
r_glsl_offsetmapping_reliefmapping 0
r_glsl_deluxemapping 1
seta r_minlight 3
seta gl_overbright_models 0
r_hdr_scenebrightness 1.45
v_gamma 1.3125
v_contrast 1.125
v_glslgamma_2d 1
r_lerpsprites 0				// stops sprite frame ghosting
r_bloom 1
r_bloom_blur 0.1
r_bloom_brighten 0.1
cl_particles_quality 1
showfps 1

// ---- sound
volume 0.7
bgmvolume 0.2

// ---- dual FPS / vehicle keybind config (menu_options.qc, csqc.main.qc)
seta bm_veh_config "0" "Separate vehicle keybinds: 0=unified with FPS binds, 1=use Vehicle Config while driving"
seta bm_veh_init "0" "1 once default WASD vehicle binds have been seeded into bindmap 1"
alias _bm_nop ""
