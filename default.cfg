// BakersfieldQuake (Bakersfield LAN) default.cfg - what a brand new player gets.
// Runs before config.cfg, so anything a player changes in game is saved and wins next time.
// Part 1 is Combat+'s own default.cfg (mod cvars and aliases) with a few multiplayer changes
// (no chain lightning, no slow motion on deaths, no grappling hook, no quickload).

//New cvars

set weapon_chain_thunderbolt "0" "Turns the LG into a superweapon, with child bolts attacking enemies in a radius"
set chainsaw_dm_spawn  "0" "Players spawn with Chainsaws in DM, useful for maps that don't have the chainsaw on them"
set chainsaw_replaces_ring "0" "Chainsaw replaces ring of shadows in deathmatch - useful for old or existing maps" 
set chainsaw_drops "1" "Chainsaw will randomly drop from gibbed ogres"
set deathmatch_music "1" "randomized music player: plays Q3 tracks in deathmatch mode"
set z_coopconfig "1" "server param to check the loaded config, recommended you do not change"
set redarmor_backpack "1" "when enabled, there's a 20% chance for a backpack with proximity grenades and ammo to spawn instead of red armor. Can also give you more than max ammo if you have enough."
set effects_sparkballs "1" "enables sparkballs from explosions like Quake Champions or FEAR - not recommended for coop play"
set effects_classic_explosion "0" "enables classic software quake inspired particle effects for rocket/grenade explosions"
set effects_explosion_shake "1" "enables HL1/Duke 3D style screen shakes on explosions"
set enforcer_defender "1" "makes the green enforcer variant into a defender a la Quoth/AD - shotgun and rapid fire laser"
set enforcer_defender_prox "0" "gives the defender a chance to launch a proximity mine, slightly closer to his behavior in Quoth/AD mods"
set shalrath_mother "1"	"gives a small chance for the vore to have the ability to spawn vorelings"
set teleport_everything "0" "allow projectiles to pass through teleports in SP, OFF by default, ^1BREAKS SPAWNERS IN SP MAPS"
set teleport_everything_dm "1" "allow projectiles to pass through teleports in deathmatch, ON by default"
set slowmotion_randomness_player "0" "slowmo chance during player death"
set soldier_nailgrunt "1" "Grunts with glowing eye model uses a nailgun instead of a shotgun"
set slowmo_powerup "0" "replace powerup with slowmo rune, 1 = ring of shadows, 2 = quad, 3 = biosuit, 4 = pent "
set centered_weapons "0" "Replace default models with centered versions"
set qc_ssg "1" "Replace the old DMC/Q2-inspired SSG with a remake of the Quake Champions SSG"
set bright_skins "1" "player models are fullbright (ezQuake style), easier to spot; 0 = lit by the map"

//New Cheats
set cheat_crazyexplosives 0 "new cheat, insane fire rate for rockets and grenades. Performance killer"
set cheat_hook_sp "0" "new cheat to enable the swinging grappling hook in single player"

//CTF convars
set mp_grapple "0" "enable swinging grappling hook in multiplay - 1 - swinging only (skill based) - 2 - classic reeling + swing"
set ctf "0" "enable CTF gametype on maps that support it"
set ctf_autobalance "1" "autobalance teams in CTF mode (recommended)"
set ctf_capture_limit "4" "Amount of captures required to win"

//general server
set bot_count "0" "amount of bots to spawn in MP"


set lowspec "0" "low settings for older computers (MENU CONTROLLED)"

//Coop
set coop_life_pool "0" "coop gamemode where each player has a limited pool of lives (default 3), upon all players running out the level restarts" 
set coop_lives "3" "How many lives players have in coop with the lives sytem"
set coop_revive "1" "When lives are enabled, respawn where you died (hazards are excluded and revert to standard spawns)"

set r_wateralpha "0.4"

//keybind aliases
alias chasecam "impulse 206"
alias throwgrenade "impulse 215" ":Offhand throw proximity grenade"
alias addbot "impulse 100" ":add bot to server - if teamplay enabled will be on your team"
alias removebot "impulse 102" ":remove bot from server"
alias addbotenemy "impulse 101" ":add bot on enemy team"
alias togglekeybinds "wait 5" ":open keybinds menu"
alias change_team "impulse 13" ": swap teams in CTF"
alias reload "impulse 41"
alias reloadm4 "impulse 41"

cl_decals_max "512"
cl_decals_time "60"

r_coronas "0.6"

// ======================================================================= part 2: modern defaults

// ---- keys: clean WASD layout, nothing single-player (no save/load/quickload/pause/quit keys)
// (the default keys are in bm_binds.cfg: applied once on first launch, see quake.rc)
alias vote "cmd vote $*"		// map votes (bm_match.qc): "vote map fox" in chat, then "vote yes" / "vote no"

// ---- mouse and movement
freelook 1
lookspring 0
m_filter 0				// raw mouse; smoothing only adds lag
m_pitch 0.022			// not inverted
m_yaw 0.022
sensitivity 3
cl_forwardspeed 999		// always run
cl_backspeed 999
cl_sidespeed 999
cl_upspeed 999

// ---- view
fov 100					// DarkPlaces fov is measured on a 4:3 screen; 100 is about 115 degrees on 16:9
cl_bob 0
cl_rollangle 0
crosshair 5
v_kicktime 0.3

// ---- video: 1080p 16:9 fullscreen + full Combat+ graphics + fast-load optimizations
vid_fullscreen 1
vid_width 1920
vid_height 1080
vid_conwidth 960
vid_conheight 540
vid_vsync 0
vid_gl20 1
vid_samples 4
cl_maxfps 250
cl_maxidlefps 20
gl_picmip 0
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
gl_texture_anisotropy 16
gl_texturecompression 0
mod_bsp_portalize 0
developer 0
r_shadow_realtime_dlight 1
r_shadow_realtime_dlight_shadows 1
r_shadow_realtime_world 0
r_shadow_gloss 1
r_glsl_offsetmapping 1
r_hdr_scenebrightness 1.45
v_gamma 1.3125
v_contrast 1.125
v_glslgamma 1
v_glslgamma_2d 1
r_lerpsprites 0				// stops sprite frame ghosting
r_bloom 1
r_bloom_blur 0.1
r_bloom_brighten 0.1
cl_particles_quality 1
cl_decals_visculling 1

// ---- sound
volume 0.7
bgmvolume 0.2
