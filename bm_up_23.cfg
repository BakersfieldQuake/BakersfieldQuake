// BakersfieldQuake migration v22 -> v23 (quake.rc: bm_up_22 runs it once for anyone at v22):
// Restore CoD-style floorplan blueprint disc minimap with clearer visibility, big powerups (in-range), enemies, and nearby vehicles.
seta bm_minimap "1"
seta bm_minimap_range "1500"
seta bm_minimap_size "42"
seta bm_minimap_alpha "0.94"
seta bm_minimap_bg_alpha "0.56"
seta bm_minimap_map_alpha "1.0"
seta bm_minimap_fov "0.09"
seta bm_minimap_powerups "1"
seta bm_minimap_vehicles "1"
