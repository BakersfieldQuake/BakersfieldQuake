<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quake Player Models</title>
<style>
:root {
  --bg: #12131a;
  --panel: rgba(18, 19, 26, 0.72);
  --line: rgba(255, 255, 255, 0.14);
  --text: #eceef4;
  --muted: #a3a8b8;
  --accent: #ff7ab6;
  --accent-ink: #1a0c14;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas.drag { cursor: grabbing; }
.hud { position: fixed; left: 16px; right: 16px; pointer-events: none; display: flex; flex-direction: column; gap: 10px; }
.hud > * { pointer-events: auto; }
.top { top: 14px; align-items: flex-start; }
.bottom { bottom: 14px; align-items: center; }
h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: 0.01em; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.title { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: none; }
.bar { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; flex-wrap: wrap;
  gap: 8px; justify-content: center; max-width: 920px; }
.group { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
button { font: inherit; color: var(--text); background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 13px; cursor: pointer; transition: background 0.12s, border-color 0.12s; }
button:hover { background: rgba(255, 255, 255, 0.15); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
label.speed { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; padding: 0 6px; }
input[type=range] { width: 110px; accent-color: var(--accent); }
output { min-width: 3ch; color: var(--text); font-variant-numeric: tabular-nums; }
.hint { margin: 0; color: var(--muted); font-size: 12px; text-shadow: 0 1px 2px #000; }
.tag { position: fixed; left: 0; top: 0; pointer-events: none; transform: translate(-50%, -100%);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px;
  font-size: 13px; font-weight: 600; white-space: nowrap; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.tag .dim { color: var(--muted); font-weight: 400; margin-left: 7px; font-size: 12px; }
#fail { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
@media (max-width: 560px) {
  h1 { font-size: 17px; } .sep { display: none; } button { padding: 6px 11px; font-size: 14px; }
}
</style>
</head>
<body>
<canvas id="gl" aria-label="3D view of the two player models; drag to orbit, scroll to zoom"></canvas>
<div id="tags"></div>
<div id="fail"><p>This page needs WebGL 2, which this browser or device does not provide.</p></div>

<div class="hud top">
  <div class="title">
    <h1>Quake player models</h1>
    <p class="sub" id="stats"></p>
  </div>
</div>

<div class="hud bottom">
  <div class="bar">
    <div class="group" id="anims" role="group" aria-label="Animation"></div>
    <div class="sep" aria-hidden="true"></div>
    <div class="group">
      <button id="walk" aria-pressed="true">Walk around</button>
      <button id="wire" aria-pressed="false">Wireframe</button>
      <button id="spin" aria-pressed="true">Auto-orbit</button>
      <label class="speed">Speed <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1"><output id="speedv">1.0×</output></label>
    </div>
  </div>
  <p class="hint">Drag to orbit · scroll or pinch to zoom</p>
</div>

<script>
(() => {
'use strict';
const DATA = __MODELS_JSON__;

// ------------------------------------------------------------------ data
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ANORM = new Float32Array(DATA.anorm);
const models = DATA.models.map(m => {
  const o = Object.assign({}, m);
  o.texSrc = m.tex;
  o.tris = new Uint16Array(unb64(m.tris).buffer);
  const st = new Uint16Array(unb64(m.st).buffer);
  o.uv = new Float32Array(m.nv * 2);
  for (let i = 0; i < m.nv; i++) { o.uv[2 * i] = (st[2 * i] + 0.5) / m.sw; o.uv[2 * i + 1] = (st[2 * i + 1] + 0.5) / m.sh; }
  o.pos = unb64(m.pos);
  o.nrm = unb64(m.nrm);
  const edges = new Set();
  for (let i = 0; i < o.tris.length; i += 3) for (let k = 0; k < 3; k++) {
    const a = o.tris[i + k], b = o.tris[i + (k + 1) % 3];
    edges.add(a < b ? a * 65536 + b : b * 65536 + a);
  }
  o.edges = new Uint16Array(edges.size * 2);
  let n = 0;
  for (const e of edges) { o.edges[n++] = Math.floor(e / 65536); o.edges[n++] = e % 65536; }
  o.P = new Float32Array(m.nv * 3);
  o.N = new Float32Array(m.nv * 3);
  return o;
});
const m0 = models[0];
document.getElementById('stats').textContent =
  `${models.length} characters · ${m0.names.length} animation frames each · classic Quake MDL`;

// ------------------------------------------------------------------ animation clips (frame names from player.qc)
const fi = {};
m0.names.forEach((n, i) => fi[n] = i);
const seq = (p, n) => Array.from({ length: n }, (_, i) => fi[p + (i + 1)]);
const CLIPS = {
  run:   { label: 'Run',      move: true,  seq: [{ f: seq('rockrun', 6), fps: 10, loop: true }] },
  axrun: { label: 'Axe run',  move: true,  seq: [{ f: seq('axrun', 6), fps: 10, loop: true }] },
  idle:  { label: 'Idle',     move: false, seq: [{ f: seq('stand', 5), fps: 10, loop: true }] },
  shoot: { label: 'Shoot',    move: false, seq: [{ f: seq('shotatt', 6), fps: 10, hold: 0.7 }] },
  axe:   { label: 'Axe swing', move: false, seq: ['axatt', 'axattb', 'axattc', 'axattd'].map(p => ({ f: seq(p, 6), fps: 12, hold: 0.25 })) },
  pain:  { label: 'Pain',     move: false, seq: [{ f: seq('pain', 6), fps: 10, hold: 0.7 }] },
  death: { label: 'Death',    move: false, seq: [['deatha', 11], ['deathb', 9], ['deathc', 15], ['deathd', 9], ['deathe', 9]]
           .map(([p, n]) => ({ f: seq(p, n), fps: 10, hold: 1.3 })) },
};

function sample(clip, t) {
  const segs = clip.seq;
  if (segs.length === 1 && segs[0].loop) {
    const s = segs[0], n = s.f.length, p = (t * s.fps) % n, i = Math.floor(p);
    return [s.f[i], s.f[(i + 1) % n], p - i];
  }
  let total = 0;
  for (const s of segs) total += s.f.length / s.fps + (s.hold || 0);
  let tt = t % total;
  for (const s of segs) {
    const d = s.f.length / s.fps + (s.hold || 0);
    if (tt < d) {
      const p = Math.min(tt * s.fps, s.f.length - 1), i = Math.floor(p);
      return [s.f[i], s.f[Math.min(i + 1, s.f.length - 1)], p - i];
    }
    tt -= d;
  }
  return [s_last(segs), s_last(segs), 0];
}
const s_last = segs => segs[segs.length - 1].f[segs[segs.length - 1].f.length - 1];

function poseInto(m, fa, fb, u) {
  const nv = m.nv, S = m.scale, T = m.trans, P = m.pos, NR = m.nrm, out = m.P, on = m.N;
  const oa = fa * nv, ob = fb * nv;
  for (let i = 0; i < nv; i++) {
    const ia = (oa + i) * 3, ib = (ob + i) * 3, o = i * 3;
    for (let k = 0; k < 3; k++) {
      const pa = P[ia + k] * S[k] + T[k], pb = P[ib + k] * S[k] + T[k];
      out[o + k] = pa + (pb - pa) * u;
    }
    const na = NR[oa + i] * 3, nb = NR[ob + i] * 3;
    const x = ANORM[na] + (ANORM[nb] - ANORM[na]) * u;
    const y = ANORM[na + 1] + (ANORM[nb + 1] - ANORM[na + 1]) * u;
    const z = ANORM[na + 2] + (ANORM[nb + 2] - ANORM[na + 2]) * u;
    const l = 1 / (Math.hypot(x, y, z) || 1);
    on[o] = x * l; on[o + 1] = y * l; on[o + 2] = z * l;
  }
}

// ------------------------------------------------------------------ matrices (column-major, Z up)
const mul = (a, b) => {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0;
    for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
    o[c * 4 + r] = s;
  }
  return o;
};
const persp = (fovy, asp, n, f) => {
  const t = 1 / Math.tan(fovy / 2), o = new Float32Array(16);
  o[0] = t / asp; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f);
  return o;
};
const lookAt = (e, c, up) => {
  let z = [e[0] - c[0], e[1] - c[1], e[2] - c[2]];
  let l = Math.hypot(...z); z = z.map(v => v / l);
  let x = [up[1] * z[2] - up[2] * z[1], up[2] * z[0] - up[0] * z[2], up[0] * z[1] - up[1] * z[0]];
  l = Math.hypot(...x); x = x.map(v => v / l);
  const y = [z[1] * x[2] - z[2] * x[1], z[2] * x[0] - z[0] * x[2], z[0] * x[1] - z[1] * x[0]];
  const d = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  return new Float32Array([x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -d(x, e), -d(y, e), -d(z, e), 1]);
};
const placeM = (px, py, pz, yaw) => {
  const c = Math.cos(yaw), s = Math.sin(yaw);
  return new Float32Array([c, s, 0, 0, -s, c, 0, 0, 0, 0, 1, 0, px, py, pz, 1]);
};

// ------------------------------------------------------------------ WebGL
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
if (!gl) { document.getElementById('fail').style.display = 'grid'; return; }

const BG = [0.07, 0.075, 0.1];
function prog(vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, '#version 300 es\n' + src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
const uni = (p, names) => Object.fromEntries(names.map(n => [n, gl.getUniformLocation(p, n)]));

const modelVS = `
layout(location=0) in vec3 aPos; layout(location=1) in vec3 aNrm; layout(location=2) in vec2 aUv;
uniform mat4 uVP; uniform mat4 uM;
out vec3 vN; out vec2 vUv;
void main(){ vN = mat3(uM) * aNrm; vUv = aUv; gl_Position = uVP * uM * vec4(aPos, 1.0); }`;
const modelFS = `
precision highp float;
in vec3 vN; in vec2 vUv; uniform sampler2D uTex; uniform float uDim; out vec4 o;
void main(){
  vec3 n = normalize(vN);
  float key = max(dot(n, normalize(vec3(0.45, 0.35, 0.85))), 0.0);
  float fill = max(dot(n, normalize(vec3(-0.6, -0.5, 0.25))), 0.0);
  float l = 0.50 + 0.62 * key + 0.22 * fill + 0.10 * n.z;
  o = vec4(texture(uTex, vUv).rgb * l * uDim, 1.0);
}`;
const flatFS = `
precision highp float; uniform vec4 uColor; out vec4 o; void main(){ o = uColor; }`;
const flatVS = `
layout(location=0) in vec3 aPos; uniform mat4 uVP; uniform mat4 uM;
void main(){ gl_Position = uVP * uM * vec4(aPos, 1.0); }`;
const groundVS = `
layout(location=0) in vec2 aQ; uniform mat4 uVP; uniform vec3 uC; uniform float uSize;
out vec2 vP; out vec2 vQ;
void main(){ vQ = aQ; vP = uC.xy + aQ * uSize; gl_Position = uVP * vec4(vP, uC.z, 1.0); }`;
const groundFS = `
precision highp float; in vec2 vP; in vec2 vQ; uniform int uMode; uniform vec3 uBg; uniform float uRing; out vec4 o;
void main(){
  if (uMode == 1) {                                  // blob shadow
    float r = length(vQ);
    o = vec4(0.0, 0.0, 0.0, 0.55 * (1.0 - smoothstep(0.15, 1.0, r)));
    return;
  }
  vec2 c = floor(vP / 48.0);
  float chk = mod(c.x + c.y, 2.0);
  vec3 col = mix(vec3(0.105, 0.11, 0.135), vec3(0.155, 0.16, 0.19), chk);
  vec2 g = abs(fract(vP / 48.0 - 0.5) - 0.5) / fwidth(vP / 48.0);
  col += (1.0 - min(min(g.x, g.y), 1.0)) * 0.035;
  float rr = length(vP);
  float ring = (1.0 - smoothstep(0.0, 1.6, abs(rr - 90.0) / fwidth(rr))) * uRing;
  col = mix(col, vec3(1.0, 0.48, 0.71), ring * 0.28);
  o = vec4(mix(uBg, col, smoothstep(1100.0, 160.0, rr)), 1.0);
}`;

const pModel = prog(modelVS, modelFS), uModel = uni(pModel, ['uVP', 'uM', 'uTex', 'uDim']);
const pFlat = prog(flatVS, flatFS), uFlat = uni(pFlat, ['uVP', 'uM', 'uColor']);
const pGround = prog(groundVS, groundFS), uGround = uni(pGround, ['uVP', 'uC', 'uSize', 'uMode', 'uBg', 'uRing']);

function buf(target, data, usage) {
  const b = gl.createBuffer();
  gl.bindBuffer(target, b);
  gl.bufferData(target, data, usage);
  return b;
}
for (const m of models) {
  m.vao = gl.createVertexArray();
  gl.bindVertexArray(m.vao);
  m.bufP = buf(gl.ARRAY_BUFFER, m.P, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  m.bufN = buf(gl.ARRAY_BUFFER, m.N, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
  buf(gl.ARRAY_BUFFER, m.uv, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 0, 0);
  m.ibTris = buf(gl.ELEMENT_ARRAY_BUFFER, m.tris, gl.STATIC_DRAW);
  m.ibEdges = buf(gl.ELEMENT_ARRAY_BUFFER, m.edges, gl.STATIC_DRAW);
  m.tex = gl.createTexture();
  m.ready = false;
  const img = new Image();
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, m.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, m.nearest ? gl.NEAREST : gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    m.ready = true;
  };
  img.src = m.texSrc;
}
const quadVao = gl.createVertexArray();
gl.bindVertexArray(quadVao);
buf(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// ------------------------------------------------------------------ UI state
const state = { anim: 'run', walk: true, wire: false, spin: true, speed: 1, az: 0.55, el: 0.24, dist: 270 };
if (innerWidth < innerHeight) state.dist = 400;      // portrait phones: the walking circle needs more room
const animsEl = document.getElementById('anims');
const animBtns = {};
for (const [k, c] of Object.entries(CLIPS)) {
  const b = document.createElement('button');
  b.textContent = c.label;
  b.setAttribute('aria-pressed', k === state.anim);
  b.onclick = () => { state.anim = k; animT = 0; for (const [kk, bb] of Object.entries(animBtns)) bb.setAttribute('aria-pressed', kk === k); };
  animsEl.appendChild(b);
  animBtns[k] = b;
}
function toggle(id, key) {
  const b = document.getElementById(id);
  b.onclick = () => { state[key] = !state[key]; b.setAttribute('aria-pressed', state[key]); };
}
toggle('walk', 'walk'); toggle('wire', 'wire'); toggle('spin', 'spin');
const speedEl = document.getElementById('speed'), speedV = document.getElementById('speedv');
speedEl.oninput = () => { state.speed = +speedEl.value; speedV.textContent = state.speed.toFixed(1) + '×'; };

const tagsEl = document.getElementById('tags');
for (const m of models) {
  m.tag = document.createElement('div');
  m.tag.className = 'tag';
  m.tag.textContent = m.label;
  const dim = document.createElement('span');
  dim.className = 'dim';
  dim.textContent = m.detail;
  m.tag.appendChild(dim);
  tagsEl.appendChild(m.tag);
}

// camera: drag to orbit, wheel / pinch to zoom
let dragging = false;
const ptrs = new Map();
let pinch0 = 0, dist0 = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  dragging = true; canvas.classList.add('drag');
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); dist0 = state.dist; }
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  if (ptrs.size === 2) {
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    const [a, b] = [...ptrs.values()];
    state.dist = Math.min(620, Math.max(90, dist0 * pinch0 / (Math.hypot(a[0] - b[0], a[1] - b[1]) || 1)));
    return;
  }
  state.az -= (e.clientX - p[0]) * 0.008;
  state.el = Math.min(1.4, Math.max(0.02, state.el + (e.clientY - p[1]) * 0.006));
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
});
const endPtr = e => { ptrs.delete(e.pointerId); if (!ptrs.size) { dragging = false; canvas.classList.remove('drag'); } };
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  state.dist = Math.min(620, Math.max(90, state.dist * Math.exp(e.deltaY * 0.001)));
}, { passive: false });

// ------------------------------------------------------------------ frame loop
const WALK_R = 90, WALK_V = 110;        // circle radius and ground speed matched to the 10 fps run cycle
let animT = 0, walkT = 0, last = performance.now();

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  resize();
  const clip = CLIPS[state.anim];
  animT += dt * state.speed;
  if (state.walk && clip.move) walkT += dt * state.speed;
  if (state.spin && !dragging) state.az += dt * 0.14;

  const [fa, fb, u] = sample(clip, animT);
  const moving = state.walk && clip.move;
  models.forEach((m, i) => {
    poseInto(m, fa, fb, u);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.bufP); gl.bufferSubData(gl.ARRAY_BUFFER, 0, m.P);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.bufN); gl.bufferSubData(gl.ARRAY_BUFFER, 0, m.N);
    if (moving) {                                       // spaced evenly round one circle, same direction
      const th = 2 * Math.PI * i / models.length + (WALK_V / WALK_R) * walkT;
      m.px = WALK_R * Math.cos(th); m.py = WALK_R * Math.sin(th); m.yaw = th + Math.PI / 2;
    } else {
      m.px = 0; m.py = (i - (models.length - 1) / 2) * 52; m.yaw = 0;
    }
    m.M = placeM(m.px, m.py, 24, m.yaw);                // player.mdl stands on z = -24
  });

  const w = canvas.width, h = canvas.height;
  gl.viewport(0, 0, w, h);
  gl.clearColor(BG[0], BG[1], BG[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);

  const tgt = [0, 0, 26];
  const eye = [tgt[0] + state.dist * Math.cos(state.el) * Math.cos(state.az),
               tgt[1] + state.dist * Math.cos(state.el) * Math.sin(state.az),
               tgt[2] + state.dist * Math.sin(state.el)];
  const VP = mul(persp(0.75, w / h, 8, 4000), lookAt(eye, tgt, [0, 0, 1]));

  // floor
  gl.useProgram(pGround);
  gl.bindVertexArray(quadVao);
  gl.uniformMatrix4fv(uGround.uVP, false, VP);
  gl.uniform3f(uGround.uBg, BG[0], BG[1], BG[2]);
  gl.uniform3f(uGround.uC, 0, 0, 0); gl.uniform1f(uGround.uSize, 1300);
  gl.uniform1i(uGround.uMode, 0);
  gl.uniform1f(uGround.uRing, moving ? 1 : 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // blob shadows
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.uniform1i(uGround.uMode, 1); gl.uniform1f(uGround.uSize, 24);
  for (const m of models) { gl.uniform3f(uGround.uC, m.px, m.py, 0.3); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }
  gl.depthMask(true); gl.disable(gl.BLEND);

  // models
  for (const m of models) {
    if (!m.ready) continue;
    gl.bindVertexArray(m.vao);
    gl.useProgram(pModel);
    gl.uniformMatrix4fv(uModel.uVP, false, VP);
    gl.uniformMatrix4fv(uModel.uM, false, m.M);
    gl.uniform1f(uModel.uDim, (state.wire ? 0.42 : 1.0) * (m.gain || 1));
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, m.tex); gl.uniform1i(uModel.uTex, 0);
    gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1, 1);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ibTris);
    gl.drawElements(gl.TRIANGLES, m.tris.length, gl.UNSIGNED_SHORT, 0);
    gl.disable(gl.POLYGON_OFFSET_FILL);
    if (state.wire) {
      gl.useProgram(pFlat);
      gl.uniformMatrix4fv(uFlat.uVP, false, VP);
      gl.uniformMatrix4fv(uFlat.uM, false, m.M);
      gl.uniform4f(uFlat.uColor, 1, 0.8, 0.9, 0.85);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ibEdges);
      gl.drawElements(gl.LINES, m.edges.length, gl.UNSIGNED_SHORT, 0);
    }
  }

  // name tags above their heads
  for (const m of models) {
    const x = m.px, y = m.py, z = 24 + 29 + 7;      // just above the head
    const cx = VP[0] * x + VP[4] * y + VP[8] * z + VP[12], cy = VP[1] * x + VP[5] * y + VP[9] * z + VP[13];
    const cw = VP[3] * x + VP[7] * y + VP[11] * z + VP[15];
    if (cw <= 0) { m.tag.style.display = 'none'; continue; }
    m.tag.style.display = '';
    const sx = (cx / cw * 0.5 + 0.5) * canvas.clientWidth, sy = (1 - (cy / cw * 0.5 + 0.5)) * canvas.clientHeight;
    m.tag.style.transform = `translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px) translate(-50%, -100%)`;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
