// ultralow.cfg - aggressive memory & GPU diet for <=8 GB RAM PCs, low free RAM (<2 GB), or integrated GPUs under memory pressure.
// Selected automatically by Play.cmd / Start Server.cmd / Play.sh / macOS launcher (BQ_TIER=ultralow or BQ_ULTRALOW=1 forces it).
// Empirically cuts bakersfielddowntown commit from ~4.9 GB -> ~1.45 GB (-71%) and VRAM from ~5.5 GB -> ~325 MB (-94%)
// while raising minimum gameplay FPS.// To undo:  exec lowmem_off  and  exec lowgpu_off  then restart.

exec lowgpu.cfg
seta lowspec 1
gl_picmip_world 1
gl_picmip_other 2
gl_picmip_sprites 1
gl_picmip_force 1				// also scale 3D nopicmip model/NPC sheets (never touches 2D HUD/fonts)
gl_max_size 512					// cap max texture dimension to 512px (eliminates 16 MB 2K texture spikes)
gl_texturecompression 1				// S3TC/DXT GPU compression (-70% texture RAM/VRAM)
gl_texturecompression_color 1
gl_texturecompression_q3bsplightmaps 0
gl_texturecompression_2d 0
r_shadow_shadowmapping 0
r_shadow_shadowmapping_texturesize 512
r_load_normalmap 0
r_load_gloss 0
r_shadow_usenormalmap 0
r_glsl_deluxemapping 0
r_dynamic 0
r_water 0
r_lerplightstyles 0
gl_texture_anisotropy 1
gl_texturemode "GL_LINEAR_MIPMAP_NEAREST"
vid_samples 1
cl_maxfps 60
cl_particles_quality 0.25
cl_particles_rain 0
cl_particles_snow 0
cl_decals 0
cl_decals_max 0
cl_stainmaps 0
menu_background 0
mod_bsp_portalize 0
mod_freebeforeload 1
mod_q1bsp_pvs_ondemand 1
mod_q1bsp_lazy_render_bih 1
r_buffermegs_vertex 4
r_buffermegs_index16 1
r_buffermegs_index32 1
r_buffermegs_uniform 0.25
r_framedatasize 1
echo "ultra-low mode on (exec lowmem_off + exec lowgpu_off to undo)"
