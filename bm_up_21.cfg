// BakersfieldQuake migration v20 -> v21 (quake.rc: bm_up_20 runs it once for anyone at v20):
// high-ping / jitter-tolerant client netcode defaults (300-400 ms RTT).
cl_nettimesyncboundmode "7"
cl_netrepeatinput "2"
cl_movement_nettimeout "1.0"
cl_lerpexcess "0.5"
cl_maxfps_alwayssleep "0"
rate "150000"
rate_burstsize "2048"
cl_netfps "72"
cl_movement "1"
cl_movement_track_canjump "1"
