// BakersfieldQuake (Bakersfield LAN) dedicated server - Start Server.cmd runs:
//   zircon_beta_gcc.exe -dedicated 16 -game quake15 -game BakersfieldQuake +exec server.cfg

hostname "Bakersfield LAN"
sv_public 0				// LAN only: not listed on the internet, still answers LAN searches
sv_cullentities_pvs 1
maxplayers 16
sv_autodemo_perclient 0			// per-client demos fill demos/ and carry player addresses: enable only in the VPS server config
sv_autodemo_perclient_nameformat "demos/%Y-%m-%d_%H-%M"

deathmatch 1
coop 0
teamplay 0
skill 1					// FrikBot skill if bots are added
timelimit 15				// minutes per map
fraglimit 25				// frags cap per map
noexit 1				// exits on single-player maps kill instead of changing the map (costs no frags)
samelevel 0
set weaponautoswitch 0
set bm_warmup 0
set bm_botfill 0			// e.g. 4 keeps FrikBots in until there are 4 players
set bm_preload 1			// load the Wheelman Cannon sprites with the map: loading them on the first charge froze every player ~3 s
// Combat+ stuffcmd()s crosshair colour + v_psycho to every player every frame (reliable data); off as on the VPS, so a
// paused browser tab or a laggy Wi-Fi player cannot overflow the reliable queue and get dropped
set monster_health_crosshair 0
set ghost_follower_psycho_effect 0
set weapon_range_crosshair 0
set player_health_crosshair 0
set evil_faces_psycho_effect 0
set psycho 0
// gib physics ("Gyro") off: with 15 bots on soi6 it was 61% of all server QC work (every gib ticked on every server frame
// for 30-40 s). Gibs still fly and bounce; they only stop floating/tumbling. gyroset 2 turns it back on.
set gyroset 0
// flamestyle 2 (Combat+ default) makes every torch spawn a networked particle entity 20-33 times a second, about
// 1.8 KB/s per visible flame per player on id maps such as dm6 / e2m1. Style 1 draws the classic flame model (audit 2026-11-26).
set flamestyle 1
// browser players all arrive from the bakoweb bridge's address: the per-address join block (5 s) would keep the second one out
set net_connectfloodblockingtimeout 0
set net_challengefloodblockingtimeout 0

// high-ping & movement netcode (72 Hz tick, clean prediction, hitscan antilag)
sys_ticrate 0.0138889
sv_maxrate 1000000
sv_clmovement_inputtimeout 0.25
sv_gameplayfix_downtracesupportsongroundflag 1
sv_wallfriction 0
sv_jumpstep 1
sv_checkforpacketsduringsleep 1
sv_maxvelocity 6500
set pushback 0
set shellcasing 0
set sv_antilag 1
set sv_antilag_maxping 450

// map playlist, in order, looping.
set veh_respawn 30
set bm_maplist "bakersfielddowntown soicowboy_bkk bklan6 spruce practice"
set bm_votemaps "bakersfielddowntown soicowboy_bkk bklan6 spruce dm6 practice"

map bakersfielddowntown
