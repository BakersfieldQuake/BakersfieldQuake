// BakersfieldQuake (Bakersfield LAN) dedicated server - Start Server.cmd runs:
//   darkplaces.exe -dedicated 16 -game quake15 -game BakersfieldQuake +exec server.cfg

hostname "Bakersfield LAN"
sv_public 0				// LAN only: not listed on the internet, still answers LAN searches
maxplayers 16

deathmatch 1
coop 0
teamplay 0
skill 1					// FrikBot skill if bots are added
timelimit 20				// minutes per map (bklan4 is huge, 8 minutes ends before anyone has met)
fraglimit 0
noexit 1				// exits on single-player maps kill instead of changing the map (costs no frags)
samelevel 0
set weaponautoswitch 0
set bm_warmup 0
set bm_botfill 0			// e.g. 4 keeps FrikBots in until there are 4 players

// map playlist, in order, looping. dm6 is "The Dark Zone"; aerowalk is the Q3/QL classic.
// the party map. The old rotation was: e2m1 dm6 aerowalk dm3 dm4 (one name = it just reloads itself)
set bm_maplist "bklan4"

map bklan4
