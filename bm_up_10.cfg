// BakersfieldQuake update v10 -> v11: fix dark models, dark viewmodels, and stale texture-compression / gamma settings (2026-11-17).
seta r_minlight "3"
seta gl_overbright_models "0"
gl_texturecompression "0"
gl_texture_anisotropy "16"
r_hdr_scenebrightness "1.45"
v_gamma "1.3125"
v_contrast "1.125"
v_glslgamma_2d "1"
r_shadow_realtime_dlight_shadows "1"
r_glsl_offsetmapping "1"
r_bloom "1"
r_bloom_blur "0.1"
r_bloom_brighten "0.1"
