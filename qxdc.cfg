// qxdc.cfg - TruE's personal BakersfieldQuake binds & settings
// In game console (~): exec qxdc.cfg

unbindall

// ---- movement ----
bind "MOUSE2" "+forward"
bind "SPACE" "+back"
bind "," "+moveleft"
bind "." "+moveright"
bind "/" "+jump"
bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"

// ---- fire / zoom / melee ----
bind "MOUSE1" "+attack"
bind "CTRL" "+attack"
bind "MOUSE3" "+button3"
bind "o" "+button3"
bind "v" "impulse 20"

// ---- reload ----
alias reload "impulse 41"
alias reloadm4 "impulse 41"
bind "r" "reload"

// ---- weapons ----
bind "1" "impulse 1"
bind "2" "impulse 2"
bind "3" "impulse 3"
bind "4" "impulse 4"
bind "5" "impulse 5"
bind "6" "impulse 6"
bind "7" "impulse 7"
bind "8" "impulse 8"
bind "9" "impulse 14"
bind "ENTER" "impulse 7"
bind "SHIFT" "impulse 6"
bind "ALT" "impulse 5"
bind "MOUSE4" "impulse 5"
bind "MOUSE5" "impulse 3"
bind "MWHEELUP" "impulse 10"
bind "MWHEELDOWN" "impulse 12"
bind "APOSTROPHE" "impulse 10"
bind "[" "impulse 10"
bind "]" "impulse 12"

// ---- fun guns & vehicles ----
bind "q" "impulse 61"
bind "f" "impulse 61"
bind "e" "impulse 62"
bind "g" "impulse 62"
bind "i" "impulse 62"
bind "x" "impulse 63"
bind "b" "impulse 64"
bind "n" "impulse 64"
bind "u" "impulse 65"
bind "c" "impulse 67"
bind "z" "impulse 68"
bind "m" "impulse 69"
bind "=" "impulse 69"
bind "j" "impulse 71"
bind "h" "impulse 86"
bind "k" "impulse 87"
bind "p" "impulse 98"

// ---- Winged John flight binds ----
in_bind 1 "SPACE" "+jump"
in_bind 1 "w" "+forward"
in_bind 1 "s" "+back"
in_bind 1 "a" "+moveleft"
in_bind 1 "d" "+moveright"
in_bind 1 "SHIFT" "+button4"
in_bind 1 "MOUSE1" "+attack"
in_bind 1 "h" "impulse 86"
in_bind 1 "k" "impulse 87"

// ---- UI / chat / server hotkeys ----
bind "TAB" "+showscores"
bind "ESCAPE" "togglemenu"
bind "BACKQUOTE" "toggleconsole"
bind "TILDE" "toggleconsole"
bind "t" "messagemode"
bind "y" "messagemode2"
bind "F1" "addbotenemy"
bind "F2" "removebot"
bind "F3" "exec lan_server.cfg"
bind "F4" "menu_options"
bind "F5" "cmd vote yes"
bind "F6" "cmd vote no"
bind "F7" "connect 72.62.241.93:26000"
bind "F9" "echo QuickLoading...;wait;quickload"
bind "F10" "quit"
bind "F11" "screenshot"
bind "F12" "toggleconsole"
bind "PGDN" "+lookdown"
bind "PGUP" "+lookup"
bind "END" "centerview"
bind "PAUSE" "pause"
bind "+" "sizeup"

// ---- player / mouse / view ----
name "TruE"
color 2 0
fov "111"
freelook "1"
lookspring "0"
sensitivity "1"
m_pitch "0.022"
m_yaw "0.022"
m_filter "1"
+mlook
cl_forwardspeed "999"
cl_backspeed "999"
cl_sidespeed "999"
cl_movespeedkey "2.0"
chase_back "65"
chase_up "10"
crosshair_color_red "0"
crosshair_color_green "1"
crosshair_color_blue "0"
weaponautoswitch "0"
bgmvolume "0"

echo "qxdc config loaded"
