con_chat "0"
con_chatrect "0"
con_chatsize "8"
con_notifysize "8"
con_notifytime "3"
con_textsize "8"
r_font_postprocess_outline "0"
r_font_postprocess_shadow_x "0"
r_font_postprocess_shadow_y "0"
r_nearest_conchars "1"
r_textshadow "0"
scr_conalpha "1"
scr_conalphafactor "1"
scr_conalpha2factor "0"
scr_conalpha3factor "0"
scr_conbrightness "0"
