// safemode.cfg - maximum stability fallback after a crash/hang or on problematic integrated GPU drivers.
// Keeps gl_texturecompression 0 (avoids S3TC driver stalls), caps all textures at 256px (gl_picmip 2),
// and starts in 1024x640 windowed mode. Forced with BQ_TIER=safemode or BQ_SAFEMODE=1.
// To restore normal settings:  exec lowmem_off  and  exec lowgpu_off  then restart.

exec lowgpu.cfg
seta lowspec 1
gl_texturecompression 0
gl_max_size 256
gl_picmip 2
gl_picmip_world 2
gl_picmip_other 2
gl_picmip_sprites 1
gl_picmip_force 1
vid_fullscreen 0
vid_desktopfullscreen 0
vid_width 1024
vid_height 640
_vid_window_width 1024
_vid_window_height 640
vid_samples 1
cl_maxfps 60
gl_texture_anisotropy 1
gl_texturemode "GL_LINEAR_MIPMAP_NEAREST"
r_dynamic 0
r_water 0
r_bloom 0
r_shadow_realtime_dlight 0
r_shadow_realtime_dlight_shadows 0
r_shadow_shadowmapping 0
r_shadow_shadowmapping_texturesize 512
r_load_normalmap 0
r_load_gloss 0
r_shadow_usenormalmap 0
r_glsl_deluxemapping 0
r_lerplightstyles 0
cl_particles_quality 0.25
cl_particles_rain 0
cl_particles_snow 0
cl_decals 0
cl_decals_max 0
cl_stainmaps 0
menu_background 0
mod_bsp_portalize 0
mod_freebeforeload 1
mod_q1bsp_pvs_ondemand 1
mod_q1bsp_lazy_render_bih 1
r_buffermegs_vertex 4
r_buffermegs_index16 1
r_buffermegs_index32 1
r_buffermegs_uniform 0.25
r_framedatasize 1
echo "SAFE MODE active (no S3TC compression, 256px cap, 1024x640 windowed)"
